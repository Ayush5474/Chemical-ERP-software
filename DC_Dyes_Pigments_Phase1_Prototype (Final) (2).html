/** Jumps from Box View straight into Table View, pre-filtered to one grade. */
function jumpToFormulaTable(grade){
  formulaView='table'; formulaTableFilters.grade=grade; formulaTableFilters.formulaName=''; formulaTableFilters.defaultOnly=''; formulaTableFilters.matId='';
  renderFormulas();
}
function drawFormulaTable(){
  const d = db();
  const body = document.getElementById('formula-view-body');
  const grades = d.products.map(p=>({value:p.grade,label:p.grade}));
  const formulaNames = [...new Set(d.products.flatMap(p=>getFormulas(p.id).map(f=>f.label)))].map(n=>({value:n,label:n}));
  function buildRows(){
    const rows = [];
    d.products.forEach(p=>{
      getFormulas(p.id).forEach(f=>{
        f.items.forEach(i=>{
          rows.push({grade:p.grade, gradeName:p.name, formulaName:f.label, isDefault:f.isDefault, matId:i.matId, qty:i.qty, unit:i.unit, lotQty:p.lotQty, lotUnit:p.unit});
        });
      });
    });
    return rows.filter(r=>{
      if(formulaTableFilters.grade && r.grade!==formulaTableFilters.grade) return false;
      if(formulaTableFilters.formulaName && r.formulaName!==formulaTableFilters.formulaName) return false;
      if(formulaTableFilters.defaultOnly==='yes' && !r.isDefault) return false;
      if(formulaTableFilters.matId && r.matId!==formulaTableFilters.matId) return false;
      return true;
    });
  }
  function redraw(){
    const rows = buildRows();
    document.getElementById('ft-table').innerHTML = `
      <table>
        <thead><tr><th>Grade</th><th>Grade Name</th><th>Formula Name</th><th>Default</th><th>Raw Material</th><th>Qty / Lot</th><th>Standard Lot Qty</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr>
            <td><span class="badge badge-blue">${r.grade}</span></td>
            <td>${r.gradeName}</td>
            <td>${r.formulaName}</td>
            <td>${r.isDefault? '<span class="badge badge-green">Yes</span>' : '<span class="badge badge-gray">No</span>'}</td>
            <td>${matName(r.matId)}</td>
            <td>${fmtNum(r.qty, r.unit==='g'?0:2)} ${r.unit}</td>
            <td>${fmtNum(r.lotQty,1)} ${r.lotUnit} / lot</td>
          </tr>`).join('') || `<tr><td colspan="7" class="empty-state">No formula lines match the current filters.</td></tr>`}
        </tbody>
      </table>
    `;
    document.getElementById('ft-count').textContent = `${rows.length} formula line(s)`;
  }
  body.innerHTML = `
    <div class="filter-bar no-print">
      <div class="filter-field"><label>Grade</label><select class="input" id="ft-grade">${selectOptions(formulaTableFilters.grade, grades)}</select></div>
      <div class="filter-field"><label>Formula Name</label><select class="input" id="ft-fname">${selectOptions(formulaTableFilters.formulaName, formulaNames)}</select></div>
      <div class="filter-field"><label>Default only</label><select class="input" id="ft-default"><option value="">All</option><option value="yes" ${formulaTableFilters.defaultOnly==='yes'?'selected':''}>Yes</option></select></div>
      <div class="filter-field"><label>Raw Material</label><select class="input" id="ft-mat">${selectOptions(formulaTableFilters.matId, d.rawMaterials.map(m=>({value:m.id,label:m.name+' ('+m.shortCode+'-'+m.grade+')'})))}</select></div>
      <div class="filter-actions"><span class="filter-count" id="ft-count"></span><button class="btn btn-outline btn-sm" id="ft-reset">Reset Filters</button></div>
    </div>
    <div class="table-wrap"><div id="ft-table"></div></div>
  `;
  document.getElementById('ft-grade').addEventListener('change', e=>{ formulaTableFilters.grade=e.target.value; redraw(); });
  document.getElementById('ft-fname').addEventListener('change', e=>{ formulaTableFilters.formulaName=e.target.value; redraw(); });
  document.getElementById('ft-default').addEventListener('change', e=>{ formulaTableFilters.defaultOnly=e.target.value; redraw(); });
  document.getElementById('ft-mat').addEventListener('change', e=>{ formulaTableFilters.matId=e.target.value; redraw(); });
  document.getElementById('ft-reset').addEventListener('click', ()=>{ formulaTableFilters.grade=''; formulaTableFilters.formulaName=''; formulaTableFilters.defaultOnly=''; formulaTableFilters.matId=''; drawFormulaTable(); });
  redraw();
}
function drawFormulaGrid(){
  const d = db();
  const grid = document.getElementById('formula-grid');
  grid.innerHTML = d.products.map(p=>{
    const list = getFormulas(p.id);
    return `
      <div class="card card-pad">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <div style="cursor:pointer;" data-jump-grade="${p.grade}" title="View in Table View"><strong style="font-size:14px;">${p.grade}</strong> <span style="color:hsl(var(--muted-foreground));font-size:12.5px;">— ${p.name}</span></div>
          <button class="btn btn-outline btn-sm" data-add-for="${p.id}">${icon('plus')} New Formula</button>
        </div>
        <div class="kv"><span class="k">Standard Lot Qty</span><span class="v">${fmtNum(p.lotQty,1)} ${p.unit} / lot</span></div>
        ${list.length===0? `<div class="empty-state" style="padding:18px 0;">No formula defined yet for this grade.</div>` :
        list.map(f=>`
          <div class="formula-card ${f.isDefault?'is-default':''}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <strong style="font-size:13px;">${f.label}</strong>
                ${f.isDefault? `<span class="badge badge-green">${icon('star')}Default</span>` : `<button class="btn btn-ghost btn-sm" data-setdefault="${p.id}|${f.id}">Set as default</button>`}
              </div>
              <div style="display:flex;gap:6px;">
                <button class="icon-btn" data-edit="${p.id}|${f.id}">${icon('edit')}</button>
                ${list.length>1? `<button class="icon-btn" data-delformula="${p.id}|${f.id}">${icon('trash')}</button>` : ''}
              </div>
            </div>
            <table>
              <thead><tr><th>Raw Material</th><th style="text-align:right;">Qty / Lot</th></tr></thead>
              <tbody>
                ${f.items.length===0? `<tr><td colspan="2" style="color:hsl(var(--muted-foreground));">No ingredients yet.</td></tr>` :
                f.items.map(i=>`<tr><td>${matName(i.matId)}</td><td style="text-align:right;">${fmtNum(i.qty, i.unit==='g'?0:2)} ${i.unit}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        `).join('')}
      </div>`;
  }).join('');

  grid.querySelectorAll('[data-jump-grade]').forEach(el=> el.addEventListener('click', ()=> jumpToFormulaTable(el.getAttribute('data-jump-grade'))));
  grid.querySelectorAll('[data-add-for]').forEach(btn=> btn.addEventListener('click', ()=> openFormulaEditor(null, btn.getAttribute('data-add-for'))));
  grid.querySelectorAll('[data-edit]').forEach(btn=> btn.addEventListener('click', ()=>{
    const [pid, fid] = btn.getAttribute('data-edit').split('|');
    openFormulaEditor(fid, pid);
  }));
  grid.querySelectorAll('[data-setdefault]').forEach(btn=> btn.addEventListener('click', ()=>{
    const [pid, fid] = btn.getAttribute('data-setdefault').split('|');
    setDefaultFormula(pid, fid);
    toast('Default formula updated'); drawFormulaGrid();
  }));
  grid.querySelectorAll('[data-delformula]').forEach(btn=> btn.addEventListener('click', ()=>{
    const [pid, fid] = btn.getAttribute('data-delformula').split('|');
    const d2 = db();
    const list = d2.formulas[pid];
    const wasDefault = list.find(f=>f.id===fid)?.isDefault;
    d2.formulas[pid] = list.filter(f=>f.id!==fid);
    if(wasDefault && d2.formulas[pid].length) d2.formulas[pid][0].isDefault = true;
    toast('Formula deleted'); drawFormulaGrid();
  }));
}
/** formulaId === null -> creating a new formula (productId still required, but can be changed in the modal). */
function openFormulaEditor(formulaId, productId){
  const d = db();
  const isNew = !formulaId;
  const existing = isNew ? null : getFormulaById(productId, formulaId);
  let rows = isNew ? [] : existing.items.map(r=>({...r}));
  let selectedProductId = productId;

  function rowsHtml(){
    return rows.map((r,idx)=>`
      <div style="display:grid;grid-template-columns:2fr 1fr 90px 34px;gap:8px;margin-bottom:8px;align-items:center;" data-row="${idx}">
        <select class="input formula-mat">${d.rawMaterials.map(m=>`<option value="${m.id}" ${m.id===r.matId?'selected':''}>${m.name} (${m.shortCode}-${m.grade})</option>`).join('')}</select>
        <input class="input formula-qty" type="number" step="0.01" value="${r.qty}" />
        <select class="input formula-unit"><option value="kg" ${r.unit==='kg'?'selected':''}>kg</option><option value="g" ${r.unit==='g'?'selected':''}>g</option></select>
        <button class="icon-btn formula-del">${icon('trash')}</button>
      </div>
    `).join('');
  }
  openModal(`
    <div class="modal-head"><h3>${isNew? 'Add Formula' : 'Edit Formula'}</h3><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="field-row" style="grid-template-columns:1fr 1fr;">
        <div class="field">
          <label class="field-label">Product / Grade</label>
          <select class="input" id="f-product" ${isNew? '' : 'disabled'}>${d.products.map(p=>`<option value="${p.id}" ${p.id===selectedProductId?'selected':''}>${p.grade} — ${p.name}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label class="field-label">Formula Label</label>
          <input class="input" id="f-label" placeholder="e.g. Standard Formula, Monsoon Mix" value="${existing? escapeHtml(existing.label) : ''}" />
        </div>
      </div>
      <div class="field" style="margin-bottom:10px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;">
          <input type="checkbox" id="f-default" ${existing && existing.isDefault ? 'checked' : ''} />
          Set as the default formula used automatically in Production Entry
        </label>
      </div>
      <div id="formula-rows">${rowsHtml()}</div>
      <button class="btn btn-outline btn-sm" id="formula-add-row" style="margin-top:4px;">${icon('plus')} Add Ingredient</button>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="save-formula">${isNew?'Save Formula':'Save Changes'}</button></div>
  `, {large:true});

  function syncRowsFromDom(){
    const matEls = document.querySelectorAll('.formula-mat');
    const qtyEls = document.querySelectorAll('.formula-qty');
    const unitEls = document.querySelectorAll('.formula-unit');
    matEls.forEach((el,i)=>{ rows[i].matId=el.value; rows[i].qty=parseFloat(qtyEls[i].value)||0; rows[i].unit=unitEls[i].value; });
  }
  function bindRowEvents(){
    document.querySelectorAll('.formula-del').forEach(b=>b.addEventListener('click', (e)=>{
      syncRowsFromDom();
      const idx = parseInt(e.target.closest('[data-row]').getAttribute('data-row'));
      rows.splice(idx,1);
      document.getElementById('formula-rows').innerHTML = rowsHtml();
      bindRowEvents();
    }));
  }
  bindRowEvents();
  document.getElementById('formula-add-row').addEventListener('click', ()=>{
    syncRowsFromDom();
    rows.push({matId:d.rawMaterials[0].id, qty:0, unit:'kg'});
    document.getElementById('formula-rows').innerHTML = rowsHtml();
    bindRowEvents();
  });
  if(isNew){
    document.getElementById('f-product').addEventListener('change', e=>{ selectedProductId = e.target.value; });
  }
  document.getElementById('save-formula').addEventListener('click', ()=>{
    syncRowsFromDom();
    const pid = isNew ? document.getElementById('f-product').value : productId;
    const label = document.getElementById('f-label').value.trim() || 'Formula';
    const wantDefault = document.getElementById('f-default').checked;
    if(rows.length===0){ toast('Add at least one ingredient','error'); return; }
    if(!d.formulas[pid]) d.formulas[pid] = [];
    if(isNew){
      d.formulaCounter++;
      const newFormula = {id:'FRM-'+pid.replace('PRD-','')+'-'+d.formulaCounter, label, isDefault: d.formulas[pid].length===0 ? true : wantDefault, items: rows};
      d.formulas[pid].push(newFormula);
      if(newFormula.isDefault) setDefaultFormula(pid, newFormula.id);
    } else {
      existing.label = label; existing.items = rows;
      if(wantDefault) setDefaultFormula(pid, existing.id);
    }
    closeModal(); toast(isNew? 'Formula added' : 'Formula updated'); renderFormulas();
  });
}

/* ================= RAW MATERIAL INWARD ================= */
function renderRmInward(){
  const d = db();
  const filters = {matId:'', supplierId:'', batch:'', from:'', to:''};
  if(STATE.pendingInwardHint){ filters.matId = STATE.pendingInwardHint; }

  document.getElementById('content').innerHTML = `
    <div class="section-head">
      <div><h1>Raw Material Inward</h1><p>A single inward (receipt reference INW-xxxx) can be received in several physical batches — each batch line gets its own tracking Batch ID, generated automatically as <strong>RM-[Material Code]-[4-digit sequence]</strong> (e.g. RM-UMB-0001). The sequence runs separately per material code.</p></div>
    </div>
    ${STATE.pendingInwardHint? `<div class="hint-banner no-print">${icon('alert')}<div>Redirected from Production Entry — stock for <strong>${matName(STATE.pendingInwardHint)}</strong> was insufficient. Post an inward below, then return to Production Entry to continue where you left off.</div></div>` : ''}
    <div class="card card-pad" style="margin-bottom:22px;">
      <div class="field-row" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="field"><label class="field-label">Supplier</label><select class="input" id="inw-supplier">${d.suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">Raw Material</label><select class="input" id="inw-material">${d.rawMaterials.map(m=>`<option value="${m.id}" ${m.id===STATE.pendingInwardHint?'selected':''}>${m.name} (${m.shortCode}-${m.grade})</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">Inward Date</label><input class="input" type="date" id="inw-date" value="${todayStr()}" /></div>
      </div>
      <div style="margin:14px 0 8px;display:flex;align-items:center;justify-content:space-between;">
        <strong style="font-size:13px;">Batch lines</strong>
        <button class="btn btn-outline btn-sm" id="inw-add-row">${icon('plus')} Add Batch Line</button>
      </div>
      <div class="table-wrap" style="border:1px solid hsl(var(--border));">
        <table>
          <thead><tr><th style="width:20%;">Batch ID (auto)</th><th>No. of Bags</th><th>Weight / Bag (kg)</th><th>Total Qty (kg)</th><th>Rate (₹/kg)</th><th>Batch Value</th><th></th></tr></thead>
          <tbody id="inw-rows"></tbody>
        </table>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:26px;margin-top:14px;padding-top:14px;border-top:1px solid hsl(var(--border));">
        <div class="kv" style="border:none;"><span class="k">Total Quantity&nbsp;</span><span class="v" id="inw-total-qty">0 kg</span></div>
        <div class="kv" style="border:none;"><span class="k">Total Value&nbsp;</span><span class="v" id="inw-total-val">₹0.00</span></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:6px;">
        <button class="btn btn-primary" id="inw-save">${icon('check')} Post Inward &amp; Update Inventory</button>
      </div>
    </div>

    <div class="filter-bar no-print">
      <div class="filter-field"><label>Raw Material</label><select class="input" id="flt-mat">${selectOptions(filters.matId, d.rawMaterials.map(m=>({value:m.id,label:m.name+' ('+m.shortCode+'-'+m.grade+')'})))}</select></div>
      <div class="filter-field"><label>Supplier</label><select class="input" id="flt-sup">${selectOptions(filters.supplierId, d.suppliers.map(s=>({value:s.id,label:s.name})))}</select></div>
      <div class="filter-field"><label>Batch ID</label><input class="input" id="flt-batch" placeholder="e.g. RM-UMB-0001" value="" /></div>
      <div class="filter-field"><label>From Date</label><input class="input" type="date" id="flt-from" value="${filters.from}" /></div>
      <div class="filter-field"><label>To Date</label><input class="input" type="date" id="flt-to" value="${filters.to}" /></div>
      <div class="filter-actions">
        <span class="filter-count" id="inw-flt-count"></span>
        <button class="btn btn-outline btn-sm" id="flt-clear">Clear Filters</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="card-pad-head"><strong style="font-size:13px;">Inward transactions</strong></div>
      <table>
        <thead><tr><th>Inward ID</th><th>Batch ID(s)</th><th>Date</th><th>Material</th><th>Supplier</th><th>Batches</th><th>Total Qty</th><th>Total Value</th></tr></thead>
        <tbody id="inw-history"></tbody>
      </table>
    </div>
  `;
  STATE.pendingInwardHint = null; // consume the hint once shown

  let rows = [{bags:'', wtPerBag:'', rate:''}];
  const isEmptyRow = r => !String(r.bags).trim() && !String(r.wtPerBag).trim() && !String(r.rate).trim();
  const isValidRow = r => parseFloat(r.bags)>0 && parseFloat(r.wtPerBag)>0;
  const selectedCode = ()=>{ const m = d.rawMaterials.find(x=>x.id===document.getElementById('inw-material').value); return m? m.shortCode : ''; };

  // copy whatever is typed in the inputs back into `rows` (so re-renders never lose values)
  function syncRows(){
    document.querySelectorAll('#inw-rows tr').forEach((tr,idx)=>{
      rows[idx] = { bags: tr.querySelector('.row-bags').value, wtPerBag: tr.querySelector('.row-wtbag').value, rate: tr.querySelector('.row-rate').value };
    });
  }
  function rowsHtml(){
    return rows.map((r,idx)=>{
      const qty = (parseFloat(r.bags)||0)*(parseFloat(r.wtPerBag)||0);
      return `
      <tr data-r="${idx}">
        <td><span class="row-preview" style="font-family:monospace;font-size:12px;font-weight:700;color:hsl(var(--muted-foreground));">—</span></td>
        <td><input class="input row-bags" type="number" min="0" placeholder="200" value="${r.bags}" style="width:90px;" /></td>
        <td><input class="input row-wtbag" type="number" min="0" step="0.01" placeholder="25" value="${r.wtPerBag}" style="width:100px;" /></td>
        <td class="row-qty" style="font-weight:700;">${fmtNum(qty,1)} kg</td>
        <td><input class="input row-rate" type="number" min="0" step="0.01" placeholder="18.50" value="${r.rate}" style="width:100px;" /></td>
        <td class="row-val" style="font-weight:700;">${money(qty*(parseFloat(r.rate)||0))}</td>
        <td><button class="icon-btn row-del">${icon('trash')}</button></td>
      </tr>`;
    }).join('');
  }
  function updateTotals(){
    let totQty=0, totVal=0;
    document.querySelectorAll('#inw-rows tr').forEach((tr)=>{
      const qty = (parseFloat(tr.querySelector('.row-bags').value)||0)*(parseFloat(tr.querySelector('.row-wtbag').value)||0);
      const rate = parseFloat(tr.querySelector('.row-rate').value)||0;
      tr.querySelector('.row-qty').textContent = fmtNum(qty,1)+' kg';
      tr.querySelector('.row-val').textContent = money(qty*rate);
      totQty+=qty; totVal+=qty*rate;
    });
    document.getElementById('inw-total-qty').textContent = fmtNum(totQty,1)+' kg';
    document.getElementById('inw-total-val').textContent = money(totVal);
  }
  /** Batch ID preview: follows the selected material's code and runs on from the current sequence. */
  function refreshPreviews(){
    const code = selectedCode();
    let n = peekBatchSeq('RM', code);
    const allEmpty = rows.every(isEmptyRow);
    document.querySelectorAll('#inw-rows tr').forEach((tr,idx)=>{
      const show = !isEmptyRow(rows[idx]) || (allEmpty && idx===0);
      const el = tr.querySelector('.row-preview');
      el.textContent = show ? formatBatchId('RM', code, n++) : '—';
      el.style.color = show ? 'hsl(var(--primary))' : 'hsl(var(--muted-foreground))';
    });
  }
  function bindRows(){
    document.querySelectorAll('#inw-rows input').forEach(inp=>{
      inp.addEventListener('input', ()=>{ syncRows(); updateTotals(); refreshPreviews(); });
    });
    document.querySelectorAll('.row-del').forEach(b=>b.addEventListener('click', (e)=>{
      syncRows();
      const idx = parseInt(e.target.closest('tr').getAttribute('data-r'));
      if(rows.length===1){ toast('At least one batch line is required','error'); return; }
      rows.splice(idx,1);
      recalc();
    }));
  }
  function recalc(){
    document.getElementById('inw-rows').innerHTML = rowsHtml();
    bindRows(); updateTotals(); refreshPreviews();
  }
  document.getElementById('inw-add-row').addEventListener('click', ()=>{
    syncRows(); rows.push({bags:'', wtPerBag:'', rate:''}); recalc();
  });
  document.getElementById('inw-material').addEventListener('change', ()=>{ syncRows(); refreshPreviews(); });
  recalc();

  function historyGroups(){
    const inwards = {};
    d.rmBatches.forEach(b=>{ (inwards[b.inwardId] = inwards[b.inwardId]||[]).push(b); });
    return Object.keys(inwards).sort().reverse().map(iid=>{
      const bs = inwards[iid];
      return {id:iid, batches:bs, matId:bs[0].matId, supplierId:bs[0].supplierId, date:bs[0].date,
        qty:bs.reduce((s,b)=>s+b.qty,0), val:bs.reduce((s,b)=>s+b.qty*b.rate,0)};
    });
  }
  function matchesFilter(g){
    if(filters.matId && g.matId!==filters.matId) return false;
    if(filters.supplierId && g.supplierId!==filters.supplierId) return false;
    if(filters.batch && !g.batches.some(b=>b.batchNo.toLowerCase().includes(filters.batch.toLowerCase()))) return false;
    if(filters.from && g.date < filters.from) return false;
    if(filters.to && g.date > filters.to) return false;
    return true;
  }
  function renderHistory(){
    const all = historyGroups();
    const rows2 = all.filter(matchesFilter);
    document.getElementById('inw-history').innerHTML = rows2.length===0 ? `<tr><td colspan="8" class="empty-state">No inward transactions match the current filters.</td></tr>` :
      rows2.map(g=>`<tr>
          <td><span class="badge badge-blue">${g.id}</span></td>
          <td><div class="batch-ids">${g.batches.map(b=>`<span class="badge badge-gray" style="font-family:monospace;">${b.batchNo}</span>`).join('')}</div></td>
          <td>${fmtDate(g.date)}</td>
          <td>${matName(g.matId)}</td>
          <td>${supName(g.supplierId)}</td>
          <td>${g.batches.length} batch${g.batches.length>1?'es':''}</td>
          <td>${fmtNum(g.qty,1)} kg</td>
          <td>${money(g.val)}</td>
        </tr>`).join('');
    document.getElementById('inw-flt-count').textContent = `${rows2.length} of ${all.length} inward transactions`;
  }
  document.getElementById('flt-mat').addEventListener('change', e=>{ filters.matId=e.target.value; renderHistory(); });
  document.getElementById('flt-sup').addEventListener('change', e=>{ filters.supplierId=e.target.value; renderHistory(); });
  document.getElementById('flt-batch').addEventListener('input', e=>{ filters.batch=e.target.value; renderHistory(); });
  document.getElementById('flt-from').addEventListener('change', e=>{ filters.from=e.target.value; renderHistory(); });
  document.getElementById('flt-to').addEventListener('change', e=>{ filters.to=e.target.value; renderHistory(); });
  document.getElementById('flt-clear').addEventListener('click', ()=>{
    filters.matId=''; filters.supplierId=''; filters.batch=''; filters.from=''; filters.to='';
    document.getElementById('flt-mat').value=''; document.getElementById('flt-sup').value=''; document.getElementById('flt-batch').value='';
    document.getElementById('flt-from').value=''; document.getElementById('flt-to').value='';
    renderHistory();
  });
  renderHistory();

  document.getElementById('inw-save').addEventListener('click', ()=>{
    syncRows();
    const supplierId = document.getElementById('inw-supplier').value;
    const matId = document.getElementById('inw-material').value;
    const mat = d.rawMaterials.find(m=>m.id===matId);
    const date = document.getElementById('inw-date').value || todayStr();
    if(!mat || !mat.shortCode){ toast('This material has no Material Code — set it in the Raw Material Master first','error'); return; }
    const filled = rows.filter(r=>!isEmptyRow(r));
    if(filled.length===0){ toast('Add at least one valid batch line (bags × weight/bag)', 'error'); return; }
    if(filled.some(r=>!isValidRow(r))){ toast('Complete or remove incomplete batch lines (bags and weight per bag are required)','error'); return; }
    d.inwardCounter++;
    const inwardId = 'INW-'+pad(d.inwardCounter,4);
    const created = [];
    filled.forEach((r)=>{
      const qty = parseFloat(r.bags)*parseFloat(r.wtPerBag);
      const rate = parseFloat(r.rate)||0;
      const batchNo = takeBatchId('RM', mat.shortCode);   // read-only, never reused
      created.push(batchNo);
      d.rmBatches.push({id:'B-'+batchNo, matId, batchNo, qty, rate, date, supplierId, inwardId});
      d.rmLedger.push({id:'LG-'+batchNo, date, type:'IN', matId, batchNo, qty, rate, value:qty*rate, ref:inwardId, note:'Raw material inward — batch entry'});
    });
    toast(`Inward ${inwardId} posted — Batch ID(s): ${created.join(', ')}`);
    rows = [{bags:'', wtPerBag:'', rate:''}];
    recalc(); renderHistory();
  });
}

        <div class="filter-field"><label>Product (Material)</label><select class="input" id="pw-prod">${selectOptions(prodFilters.shortCode, products)}</select></div>
        <div class="filter-field"><label>Supplier</label><select class="input" id="pw-sup">${selectOptions(prodFilters.supplierId, d.suppliers.map(s=>({value:s.id,label:s.name})))}</select></div>
        <div class="filter-field"><label>Grade</label><select class="input" id="pw-grade">${selectOptions(prodFilters.grade, grades)}</select></div>
        <div class="filter-field"><label>Batch ID</label><input class="input" id="pw-batch" placeholder="e.g. RM-UMB-0001" value="${escapeHtml(prodFilters.batch)}" /></div>
        <div class="filter-field"><label>From Date</label><input class="input" type="date" id="pw-from" value="${prodFilters.from}" /></div>
        <div class="filter-field"><label>To Date</label><input class="input" type="date" id="pw-to" value="${prodFilters.to}" /></div>
        <div class="filter-actions"><span class="filter-count" id="pw-count"></span><button class="btn btn-outline btn-sm" id="pw-clear">Clear Filters</button></div>
      </div>
      <div id="pw-table"></div>
    `;
    function redraw(){
      const grouped = {}; // shortCode||supplier||grade -> {name,qty,batches:[]}
      d.rmBatches.filter(b=>b.qty>0.0001).forEach(b=>{
        const m = d.rawMaterials.find(x=>x.id===b.matId);
        if(!m) return;
        if(prodFilters.shortCode && m.shortCode!==prodFilters.shortCode) return;
        if(prodFilters.supplierId && b.supplierId!==prodFilters.supplierId) return;
        if(prodFilters.grade && m.grade!==prodFilters.grade) return;
        if(prodFilters.batch && !b.batchNo.toLowerCase().includes(prodFilters.batch.toLowerCase())) return;
        if(prodFilters.from && b.date < prodFilters.from) return;
        if(prodFilters.to && b.date > prodFilters.to) return;
        const key = [m.shortCode, b.supplierId, m.grade].join('||');
        if(!grouped[key]) grouped[key] = {productLabel:m.name, supplierId:b.supplierId, grade:m.grade, qty:0, batches:[]};
        grouped[key].qty += b.qty;
        grouped[key].batches.push(b.batchNo);
      });
      const leafRows = Object.values(grouped).map(g=>({
        path:[g.productLabel, supName(g.supplierId)],
        cells:[g.grade, `${fmtNum(g.qty,1)} kg`, batchChips(g.batches)]
      }));
      document.getElementById('pw-table').innerHTML = renderSpannedTable(
        ['Product','Supplier','Grade','Quantity','Batch ID(s)'],
        leafRows, 2
      );
      document.getElementById('pw-count').textContent = `${leafRows.length} supplier/grade combinations`;
    }
    document.getElementById('pw-prod').addEventListener('change', e=>{ prodFilters.shortCode=e.target.value; redraw(); });
    document.getElementById('pw-sup').addEventListener('change', e=>{ prodFilters.supplierId=e.target.value; redraw(); });
    document.getElementById('pw-grade').addEventListener('change', e=>{ prodFilters.grade=e.target.value; redraw(); });
    document.getElementById('pw-batch').addEventListener('input', e=>{ prodFilters.batch=e.target.value; redraw(); });
    document.getElementById('pw-from').addEventListener('change', e=>{ prodFilters.from=e.target.value; redraw(); });
    document.getElementById('pw-to').addEventListener('change', e=>{ prodFilters.to=e.target.value; redraw(); });
    document.getElementById('pw-clear').addEventListener('click', ()=>{ prodFilters.shortCode=''; prodFilters.supplierId=''; prodFilters.grade=''; prodFilters.batch=''; prodFilters.from=''; prodFilters.to=''; drawProductWise(); });
    redraw();
  }
  function drawStock(){
    const body = document.getElementById('rm-inv-body');
    function matches(b){
      if(stockFilters.matId && b.matId!==stockFilters.matId) return false;
      if(stockFilters.supplierId && b.supplierId!==stockFilters.supplierId) return false;
      if(stockFilters.batch && !b.batchNo.toLowerCase().includes(stockFilters.batch.toLowerCase())) return false;
      return true;
    }
    const all = d.rmBatches.filter(b=>b.qty>0.0001);
    body.innerHTML = `
      <div class="filter-bar no-print">
        <div class="filter-field"><label>Material</label><select class="input" id="sf-mat">${selectOptions(stockFilters.matId, d.rawMaterials.map(m=>({value:m.id,label:m.name+' ('+m.shortCode+'-'+m.grade+')'})))}</select></div>
        <div class="filter-field"><label>Supplier</label><select class="input" id="sf-sup">${selectOptions(stockFilters.supplierId, d.suppliers.map(s=>({value:s.id,label:s.name})))}</select></div>
        <div class="filter-field"><label>Batch ID</label><input class="input" id="sf-batch" placeholder="e.g. RM-UMB-0001" value="${escapeHtml(stockFilters.batch)}" /></div>
        <div class="filter-actions"><span class="filter-count" id="sf-count"></span><button class="btn btn-outline btn-sm" id="sf-clear">Clear Filters</button></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Material</th><th>Batch ID</th><th>Inward ID</th><th>Inward Date</th><th>Supplier</th><th>Qty Available</th><th>Rate</th><th>Batch Value</th></tr></thead>
          <tbody id="sf-tbody"></tbody>
        </table>
      </div>
    `;
    function redraw(){
      const rows = all.filter(matches).sort((a,b)=>a.matId.localeCompare(b.matId)||a.date.localeCompare(b.date));
      document.getElementById('sf-tbody').innerHTML = rows.map(b=>`
        <tr>
          <td><strong>${matName(b.matId)}</strong></td>
          <td><span class="badge badge-gray" style="font-family:monospace;">${b.batchNo}</span></td>
          <td><span class="badge badge-blue">${b.inwardId}</span></td>
          <td>${fmtDate(b.date)}</td>
          <td>${supName(b.supplierId)}</td>
          <td>${fmtNum(b.qty,1)} kg</td>
          <td>${money(b.rate)}</td>
          <td>${money(b.qty*b.rate)}</td>
        </tr>
      `).join('') || `<tr><td colspan="8" class="empty-state">No stock matches the current filters.</td></tr>`;
      document.getElementById('sf-count').textContent = `${rows.length} of ${all.length} batches`;
    }
    document.getElementById('sf-mat').addEventListener('change', e=>{ stockFilters.matId=e.target.value; redraw(); });
    document.getElementById('sf-sup').addEventListener('change', e=>{ stockFilters.supplierId=e.target.value; redraw(); });
    document.getElementById('sf-batch').addEventListener('input', e=>{ stockFilters.batch=e.target.value; redraw(); });
    document.getElementById('sf-clear').addEventListener('click', ()=>{ stockFilters.matId=''; stockFilters.supplierId=''; stockFilters.batch=''; drawStock(); });
    redraw();
  }
  function drawLedger(){
    const body = document.getElementById('rm-inv-body');
    function matches(l){
      if(ledgerFilters.matId && l.matId!==ledgerFilters.matId) return false;
      if(ledgerFilters.type && l.type!==ledgerFilters.type) return false;
      if(ledgerFilters.from && l.date < ledgerFilters.from) return false;
      if(ledgerFilters.to && l.date > ledgerFilters.to) return false;
      if(ledgerFilters.batch && !l.batchNo.toLowerCase().includes(ledgerFilters.batch.toLowerCase())) return false;
      return true;
    }
    const all = d.rmLedger;
    body.innerHTML = `
      <div class="filter-bar no-print">
        <div class="filter-field"><label>Material</label><select class="input" id="lf-mat">${selectOptions(ledgerFilters.matId, d.rawMaterials.map(m=>({value:m.id,label:m.name+' ('+m.shortCode+'-'+m.grade+')'})))}</select></div>
        <div class="filter-field"><label>Type</label><select class="input" id="lf-type"><option value="">All</option><option value="IN" ${ledgerFilters.type==='IN'?'selected':''}>IN</option><option value="OUT" ${ledgerFilters.type==='OUT'?'selected':''}>OUT</option></select></div>
        <div class="filter-field"><label>From Date</label><input class="input" type="date" id="lf-from" value="${ledgerFilters.from}" /></div>
        <div class="filter-field"><label>To Date</label><input class="input" type="date" id="lf-to" value="${ledgerFilters.to}" /></div>
        <div class="filter-field"><label>Batch ID</label><input class="input" id="lf-batch" placeholder="e.g. RM-UMB-0001" value="${escapeHtml(ledgerFilters.batch)}" /></div>
        <div class="filter-actions"><span class="filter-count" id="lf-count"></span><button class="btn btn-outline btn-sm" id="lf-clear">Clear Filters</button></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Type</th><th>Material</th><th>Batch ID</th><th>Qty</th><th>Rate</th><th>Value</th><th>Reference</th><th>Note</th></tr></thead>
          <tbody id="lf-tbody"></tbody>
        </table>
      </div>
    `;
    function redraw(){
      const rows = [...all].filter(matches).sort((a,b)=>b.date.localeCompare(a.date));
      document.getElementById('lf-tbody').innerHTML = rows.map(l=>`
        <tr>
          <td>${fmtDate(l.date)}</td>
          <td>${l.type==='IN'?'<span class="badge badge-green">IN</span>':'<span class="badge badge-red">OUT</span>'}</td>
          <td>${matName(l.matId)}</td>
          <td>${l.batchNo}</td>
          <td>${l.type==='OUT'?'-':''}${fmtNum(l.qty,1)} kg</td>
          <td>${money(l.rate)}</td>
          <td>${money(l.value)}</td>
          <td><span class="badge badge-blue">${l.ref}</span></td>
          <td style="color:hsl(var(--muted-foreground));font-size:12px;">${l.note}</td>
        </tr>
      `).join('') || `<tr><td colspan="9" class="empty-state">No ledger entries match the current filters.</td></tr>`;
      document.getElementById('lf-count').textContent = `${rows.length} of ${all.length} entries`;
    }
    document.getElementById('lf-mat').addEventListener('change', e=>{ ledgerFilters.matId=e.target.value; redraw(); });
    document.getElementById('lf-type').addEventListener('change', e=>{ ledgerFilters.type=e.target.value; redraw(); });
    document.getElementById('lf-from').addEventListener('change', e=>{ ledgerFilters.from=e.target.value; redraw(); });
    document.getElementById('lf-to').addEventListener('change', e=>{ ledgerFilters.to=e.target.value; redraw(); });
    document.getElementById('lf-batch').addEventListener('input', e=>{ ledgerFilters.batch=e.target.value; redraw(); });
    document.getElementById('lf-clear').addEventListener('click', ()=>{ ledgerFilters.matId=''; ledgerFilters.type=''; ledgerFilters.from=''; ledgerFilters.to=''; ledgerFilters.batch=''; drawLedger(); });
    redraw();
  }
  draw();
}

/* ================= PACKAGING INWARD (mirrors RM Inward) ================= */
function renderPackagingInward(){
  const d = db();
  const filters = {matId:'', supplierId:'', batch:'', from:'', to:''};

  document.getElementById('content').innerHTML = `
    <div class="section-head">
      <div><h1>Packaging Inward</h1><p>Batch-wise packaging inward, same pattern as Raw Material Inward. Each inward (PINW-xxxx) is a receipt reference; every batch line gets its own tracking Batch ID, generated automatically as <strong>PKG-[Item Code]-[4-digit sequence]</strong> (e.g. PKG-HDPE-0001). Size and Brand are stored on the batch.</p></div>
    </div>
    <div class="card card-pad" style="margin-bottom:22px;">
      <div class="field-row" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="field"><label class="field-label">Supplier</label><select class="input" id="pinw-supplier">${d.suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">Packaging Item (SKU)</label><select class="input" id="pinw-material">${d.packagingMaterials.map(m=>`<option value="${m.id}">${pkgFullLabel(m.id)}</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">Inward Date</label><input class="input" type="date" id="pinw-date" value="${todayStr()}" /></div>
      </div>
      <div class="field-row" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:4px;">
        <div class="kv" style="border:none;"><span class="k">Item Code&nbsp;</span><span class="v" id="pinw-code">—</span></div>
        <div class="kv" style="border:none;"><span class="k">Size&nbsp;</span><span class="v" id="pinw-size">—</span></div>
        <div class="kv" style="border:none;"><span class="k">Brand&nbsp;</span><span class="v" id="pinw-brand">—</span></div>
      </div>
      <div style="margin:10px 0 8px;display:flex;align-items:center;justify-content:space-between;">
        <strong style="font-size:13px;">Batch lines</strong>
        <button class="btn btn-outline btn-sm" id="pinw-add-row">${icon('plus')} Add Batch Line</button>
      </div>
      <div class="table-wrap" style="border:1px solid hsl(var(--border));">
        <table>
          <thead><tr><th style="width:20%;">Batch ID (auto)</th><th>Quantity</th><th>Rate</th><th>Grade</th><th>Batch Value</th><th></th></tr></thead>
          <tbody id="pinw-rows"></tbody>
        </table>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:26px;margin-top:14px;padding-top:14px;border-top:1px solid hsl(var(--border));">
        <div class="kv" style="border:none;"><span class="k">Total Quantity&nbsp;</span><span class="v" id="pinw-total-qty">0</span></div>
        <div class="kv" style="border:none;"><span class="k">Total Value&nbsp;</span><span class="v" id="pinw-total-val">₹0.00</span></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:6px;">
        <button class="btn btn-primary" id="pinw-save">${icon('check')} Post Inward &amp; Update Inventory</button>
      </div>
    </div>

    <div class="filter-bar no-print">
      <div class="filter-field"><label>Packaging Item (SKU)</label><select class="input" id="pflt-mat">${selectOptions(filters.matId, d.packagingMaterials.map(m=>({value:m.id,label:pkgFullLabel(m.id)})))}</select></div>
      <div class="filter-field"><label>Supplier</label><select class="input" id="pflt-sup">${selectOptions(filters.supplierId, d.suppliers.map(s=>({value:s.id,label:s.name})))}</select></div>
      <div class="filter-field"><label>Batch ID</label><input class="input" id="pflt-batch" placeholder="e.g. PKG-HDPE-0001" /></div>
      <div class="filter-field"><label>From Date</label><input class="input" type="date" id="pflt-from" value="${filters.from}" /></div>
      <div class="filter-field"><label>To Date</label><input class="input" type="date" id="pflt-to" value="${filters.to}" /></div>
      <div class="filter-actions"><span class="filter-count" id="pinw-flt-count"></span><button class="btn btn-outline btn-sm" id="pflt-clear">Clear Filters</button></div>
    </div>

    <div class="table-wrap">
      <div class="card-pad-head"><strong style="font-size:13px;">Inward transactions</strong></div>
      <table>
        <thead><tr><th>Inward ID</th><th>Batch ID(s)</th><th>Date</th><th>Item</th><th>Size</th><th>Brand</th><th>Supplier</th><th>Batches</th><th>Total Qty</th><th>Total Value</th></tr></thead>
        <tbody id="pinw-history"></tbody>
      </table>
    </div>
  `;

  const selMat = ()=> d.packagingMaterials.find(x=>x.id===document.getElementById('pinw-material').value);
  function unitOf(matId){ const m = d.packagingMaterials.find(x=>x.id===matId); return m? m.unit : ''; }
  function showSkuInfo(){
    const m = selMat();
    document.getElementById('pinw-code').textContent = m? (m.itemCode||'—') : '—';
    document.getElementById('pinw-size').textContent = m? m.size : '—';
    document.getElementById('pinw-brand').textContent = m? m.brand : '—';
  }

  let rows = [{qty:'', rate:'', grade:'Grade A'}];
  const isEmptyRow = r => !String(r.qty).trim() && !String(r.rate).trim();
  const isValidRow = r => parseFloat(r.qty)>0;
  function syncRows(){
    document.querySelectorAll('#pinw-rows tr').forEach((tr,idx)=>{
      rows[idx] = { qty: tr.querySelector('.row-qty').value, rate: tr.querySelector('.row-rate').value, grade: tr.querySelector('.row-grade').value };
    });
  }
  function rowsHtml(){
    const matId = document.getElementById('pinw-material').value;
    return rows.map((r,idx)=>{
      const qty = parseFloat(r.qty)||0;
      return `
      <tr data-r="${idx}">
        <td><span class="row-preview" style="font-family:monospace;font-size:12px;font-weight:700;color:hsl(var(--muted-foreground));">—</span></td>
        <td><input class="input row-qty" type="number" min="0" step="0.01" placeholder="Qty (${unitOf(matId)})" value="${r.qty}" style="width:120px;" /></td>
        <td><input class="input row-rate" type="number" min="0" step="0.01" placeholder="Rate" value="${r.rate}" style="width:100px;" /></td>
        <td><input class="input row-grade" placeholder="e.g. Grade A" value="${escapeHtml(r.grade)}" style="width:110px;" /></td>
        <td class="row-val" style="font-weight:700;">${money(qty*(parseFloat(r.rate)||0))}</td>
        <td><button class="icon-btn row-del">${icon('trash')}</button></td>
      </tr>`;
    }).join('');
  }
  function updateTotals(){
    let totQty=0, totVal=0;
    document.querySelectorAll('#pinw-rows tr').forEach(tr=>{
      const qty = parseFloat(tr.querySelector('.row-qty').value)||0;
      const rate = parseFloat(tr.querySelector('.row-rate').value)||0;
      tr.querySelector('.row-val').textContent = money(qty*rate);
      totQty+=qty; totVal+=qty*rate;
    });
    document.getElementById('pinw-total-qty').textContent = fmtNum(totQty,1)+' '+unitOf(document.getElementById('pinw-material').value);
    document.getElementById('pinw-total-val').textContent = money(totVal);
  }
  /** Batch ID preview follows the selected item's code and continues its own sequence. */
  function refreshPreviews(){
    const m = selMat(); const code = m? m.itemCode : '';
    let n = peekBatchSeq('PKG', code);
    const allEmpty = rows.every(isEmptyRow);
    document.querySelectorAll('#pinw-rows tr').forEach((tr,idx)=>{
      const show = !isEmptyRow(rows[idx]) || (allEmpty && idx===0);
      const el = tr.querySelector('.row-preview');
      el.textContent = show ? formatBatchId('PKG', code, n++) : '—';
      el.style.color = show ? 'hsl(var(--primary))' : 'hsl(var(--muted-foreground))';
    });
  }
  function bindRows(){
    document.querySelectorAll('#pinw-rows input').forEach(inp=> inp.addEventListener('input', ()=>{ syncRows(); updateTotals(); refreshPreviews(); }));
    document.querySelectorAll('.row-del').forEach(b=>b.addEventListener('click',(e)=>{
      syncRows();
      const idx=parseInt(e.target.closest('tr').getAttribute('data-r'));
      if(rows.length===1){ toast('At least one batch line is required','error'); return; }
      rows.splice(idx,1); recalc();
    }));
  }
  function recalc(){
    document.getElementById('pinw-rows').innerHTML = rowsHtml();
    bindRows(); updateTotals(); refreshPreviews();
  }
  document.getElementById('pinw-add-row').addEventListener('click', ()=>{ syncRows(); rows.push({qty:'', rate:'', grade:'Grade A'}); recalc(); });
  document.getElementById('pinw-material').addEventListener('change', ()=>{ syncRows(); showSkuInfo(); recalc(); });
  showSkuInfo();
  recalc();

  function historyGroups(){
    const inwards = {};
    d.packagingBatches.forEach(b=>{ (inwards[b.inwardId] = inwards[b.inwardId]||[]).push(b); });
    return Object.keys(inwards).sort().reverse().map(iid=>{
      const bs = inwards[iid];
      return {id:iid, batches:bs, matId:bs[0].matId, supplierId:bs[0].supplierId, date:bs[0].date, size:bs[0].size, brand:bs[0].brand,
        qty:bs.reduce((s,b)=>s+b.qty,0), val:bs.reduce((s,b)=>s+b.qty*b.rate,0)};
    });
  }
  function matchesFilter(g){
    if(filters.matId && g.matId!==filters.matId) return false;
    if(filters.supplierId && g.supplierId!==filters.supplierId) return false;
    if(filters.batch && !g.batches.some(b=>b.batchNo.toLowerCase().includes(filters.batch.toLowerCase()))) return false;
    if(filters.from && g.date < filters.from) return false;
    if(filters.to && g.date > filters.to) return false;
    return true;
  }
  function renderHistory(){
    const all = historyGroups();
    const rows2 = all.filter(matchesFilter);
    document.getElementById('pinw-history').innerHTML = rows2.length===0? `<tr><td colspan="10" class="empty-state">No inward transactions match the current filters.</td></tr>` :
      rows2.map(g=>`<tr>
        <td><span class="badge badge-blue">${g.id}</span></td>
        <td>${batchChips(g.batches.map(b=>b.batchNo))}</td>
        <td>${fmtDate(g.date)}</td>
        <td>${pkgName(g.matId)}</td>
        <td>${g.size||'—'}</td>
        <td>${g.brand||'—'}</td>
        <td>${supName(g.supplierId)}</td>
        <td>${g.batches.length} batch${g.batches.length>1?'es':''}</td>
        <td>${fmtNum(g.qty,1)} ${unitOf(g.matId)}</td>
        <td>${money(g.val)}</td>
      </tr>`).join('');
    document.getElementById('pinw-flt-count').textContent = `${rows2.length} of ${all.length} inward transactions`;
  }
  document.getElementById('pflt-mat').addEventListener('change', e=>{ filters.matId=e.target.value; renderHistory(); });
  document.getElementById('pflt-sup').addEventListener('change', e=>{ filters.supplierId=e.target.value; renderHistory(); });
  document.getElementById('pflt-batch').addEventListener('input', e=>{ filters.batch=e.target.value; renderHistory(); });
  document.getElementById('pflt-from').addEventListener('change', e=>{ filters.from=e.target.value; renderHistory(); });
  document.getElementById('pflt-to').addEventListener('change', e=>{ filters.to=e.target.value; renderHistory(); });
  document.getElementById('pflt-clear').addEventListener('click', ()=>{
    filters.matId=''; filters.supplierId=''; filters.batch=''; filters.from=''; filters.to='';
    document.getElementById('pflt-mat').value=''; document.getElementById('pflt-sup').value=''; document.getElementById('pflt-batch').value='';
    document.getElementById('pflt-from').value=''; document.getElementById('pflt-to').value='';
    renderHistory();
  });
  renderHistory();

  document.getElementById('pinw-save').addEventListener('click', ()=>{
    syncRows();
    const supplierId = document.getElementById('pinw-supplier').value;
    const mat = selMat();
    const date = document.getElementById('pinw-date').value || todayStr();
    if(!mat || !mat.itemCode){ toast('This item has no Item Code — set it in the Packaging Material Master first','error'); return; }
    const filled = rows.filter(r=>!isEmptyRow(r));
    if(filled.length===0){ toast('Add at least one valid batch line (quantity > 0)', 'error'); return; }
    if(filled.some(r=>!isValidRow(r))){ toast('Complete or remove incomplete batch lines (quantity is required)','error'); return; }
    d.pkgInwardCounter++;
    const inwardId = 'PINW-'+pad(d.pkgInwardCounter,4);
    const created = [];
    filled.forEach(r=>{
      const qty = parseFloat(r.qty);
      const rate = parseFloat(r.rate)||0;
      const grade = (r.grade||'').trim() || 'Grade A';
      const batchNo = takeBatchId('PKG', mat.itemCode);   // read-only, never reused
      created.push(batchNo);
      d.packagingBatches.push({id:'PB-'+batchNo, matId:mat.id, batchNo, size:mat.size, brand:mat.brand, qty, rate, date, supplierId, grade, inwardId});
      d.packagingLedger.push({id:'PLG-'+batchNo, date, type:'IN', matId:mat.id, batchNo, qty, rate, value:qty*rate, ref:inwardId, note:'Packaging inward — batch entry'});
    });
    toast(`Inward ${inwardId} posted — Batch ID(s): ${created.join(', ')}`);
    rows = [{qty:'', rate:'', grade:'Grade A'}];
    recalc(); renderHistory();
  });
}

/* ================= PACKAGING INVENTORY ================= */
function renderPackagingInventory(){
  const d = db();
  let tab = 'hierarchy';

    function redraw(){
      const leafRows = [];
      const grouped = {}; // key: item|product|size|brand|supplier|grade -> {qty,batches:[]}
      d.packagingBatches.filter(b=>b.qty>0.0001).forEach(b=>{
        const m = d.packagingMaterials.find(x=>x.id===b.matId);
        if(!m) return;
        if(hFilters.item && !m.name.toLowerCase().includes(hFilters.item.toLowerCase())) return;

        const key = [m.name, m.productId, m.size, m.brand, b.supplierId, b.grade].join('||');
        if(!grouped[key]) grouped[key] = {m, supplierId:b.supplierId, grade:b.grade, qty:0, batches:[]};

/* ================= PRODUCTION ENTRY (WIZARD) ================= */
const PROD_STEPS = ['Select Grade','No. of Lots','Required Materials','Consume &amp; Cost','Actual Output','Reconcile &amp; Finish'];

function newWizard(){
  const d = db();
  const pid = d.products[0]? d.products[0].id : null;
  const defFormula = pid ? getDefaultFormula(pid) : null;
  return {
    step:0,
    productId: pid,
    formulaId: defFormula? defFormula.id : null,
    lots: 100,
    addOns: [], // add-on materials (e.g. water, methanol) selected from the RM master, entered per lot
    packagingLines: [],
    pkgEst: null, // Stage-4 "Estimated Packaging Material" planning lines (informational only)
  };
}
function renderProduction(){
  if(!STATE.wizard) STATE.wizard = newWizard();
  drawWizard();
}
function requiredMaterials(productId, lots, formulaId){
  const formula = formulaId ? getFormulaById(productId, formulaId) : getDefaultFormula(productId);
  const items = formula ? formula.items : [];
  return items.map(i=>{
    const totalQty = toKg(i.qty, i.unit) * lots;
    const available = rmStock(i.matId);
    return {matId:i.matId, perLotQty:i.qty, perLotUnit:i.unit, totalQty, available, short: available < totalQty, source:'formula'};
  });
}
/** Add-on materials (water, methanol, etc.) follow the same per-lot × lots logic as
 *  formula materials, but are picked ad hoc from the RM master rather than the formula. */
function addOnRequiredMaterials(addOns, lots){
  return (addOns||[]).filter(a=>a.matId).map(a=>{
    const totalQty = toKg(a.qty, a.unit) * lots;
    const available = rmStock(a.matId);
    return {matId:a.matId, perLotQty:a.qty, perLotUnit:a.unit, totalQty, available, short: available < totalQty, source:'addon'};
  });
}

  const d = db();
  const w = STATE.wizard;
  const product = d.products.find(p=>p.id===w.productId);
  const formulasForProduct = product ? getFormulas(product.id) : [];
  const req = product ? requiredMaterials(w.productId, w.lots, w.formulaId).concat(addOnRequiredMaterials(w.addOns, w.lots)) : [];
  const totalWeightKg = req.reduce((s,r)=>s+r.totalQty,0);
  const anyShort = req.some(r=>r.short);
  const firstShort = req.find(r=>r.short);
  const rmCost = req.reduce((s,r)=>{
    return s + r.totalQty * rmAvgRate(r.matId);
  },0);

  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="section-head">

  `;
  content.querySelectorAll('.step .dot svg').forEach(s=>{ s.style.width='14px'; s.style.height='14px'; });

  const body = document.getElementById('wizard-body');

  if(w.step===0){
    body.innerHTML = `
      <h3 style="margin-top:0;">Step 1 — Select Product / Grade</h3>
      <div class="field-row" style="grid-template-columns:1fr 1fr;max-width:640px;">
        <div class="field">
          <label class="field-label">Product / Grade</label>
          <select class="input" id="w-product">
            ${d.products.map(p=>`<option value="${p.id}" ${p.id===w.productId?'selected':''}>${p.grade} — ${p.name}</option>`).join('')}

        </div>
        ${formulasForProduct.length>1? `
        <div class="field">
          <label class="field-label">Formula</label>
          <select class="input" id="w-formula">
            ${formulasForProduct.map(f=>`<option value="${f.id}" ${f.id===w.formulaId?'selected':''}>${f.label}${f.isDefault?' (Default)':''}</option>`).join('')}

        </div>` : `<div class="field"><label class="field-label">Formula</label><div style="padding-top:9px;font-size:13.5px;font-weight:600;">${formulasForProduct[0]? formulasForProduct[0].label : 'No formula defined'}</div></div>`}
