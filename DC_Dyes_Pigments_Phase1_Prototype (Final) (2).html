<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>D.C Dyes &amp; Pigments — Inventory ERP (Phase 1 Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --background: 231 15% 96%;
    --foreground: 230 40% 15%;
    --card: 0 0% 100%;
    --card-foreground: 230 40% 15%;
    --primary: 230 50% 50%;
    --primary-foreground: 0 0% 100%;
    --secondary: 230 20% 90%;
    --secondary-foreground: 230 50% 30%;
    --muted: 230 10% 92%;
    --muted-foreground: 230 20% 45%;
    --accent: 204 70% 50%;
    --accent-foreground: 0 0% 100%;
    --destructive: 0 84.2% 60.2%;
    --destructive-foreground: 0 0% 98%;
    --border: 230 20% 88%;
    --input: 230 20% 88%;
    --ring: 230 50% 50%;
    --radius: 0.75rem;
    --success: 152 60% 40%;
    --warning: 38 92% 50%;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:hsl(var(--background));
    color:hsl(var(--foreground));
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.font-headline{font-family:'Space Grotesk',system-ui,sans-serif;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:hsl(var(--border));border-radius:8px;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- layout ---------- */
  #app{display:none;min-height:100vh;}
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 15% 15%, hsl(230 55% 96%), transparent 45%),
    radial-gradient(circle at 85% 85%, hsl(204 60% 95%), transparent 45%),
    hsl(var(--background));}

  .shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
  .sidebar{background:hsl(230 45% 14%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar-brand{padding:20px 18px;border-bottom:1px solid hsla(0,0%,100%,.08);}
  .sidebar-brand .co{font-size:11px;letter-spacing:.06em;color:hsl(230 30% 70%);text-transform:uppercase;font-weight:600;}
  .sidebar-brand .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin-top:2px;line-height:1.25;}
  .nav-group-label{padding:14px 18px 6px;font-size:10.5px;letter-spacing:.08em;color:hsl(230 20% 55%);font-weight:700;text-transform:uppercase;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13.5px;font-weight:500;color:hsl(230 25% 80%);border-left:3px solid transparent;transition:.15s;}
  .nav-item:hover{background:hsla(0,0%,100%,.05);color:#fff;}
  .nav-item.active{background:hsla(0,0%,100%,.08);color:#fff;border-left-color:hsl(var(--accent));}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;}
  .nav-item.disabled{color:hsl(230 15% 42%);cursor:not-allowed;}
  .nav-item.disabled:hover{background:transparent;color:hsl(230 15% 42%);}
  .phase2-tag{margin-left:auto;font-size:9px;background:hsla(0,0%,100%,.08);color:hsl(230 20% 65%);padding:2px 6px;border-radius:20px;font-weight:700;letter-spacing:.03em;}
  .sidebar-foot{margin-top:auto;padding:14px 18px;border-top:1px solid hsla(0,0%,100%,.08);font-size:11px;color:hsl(230 20% 55%);}

  .main{display:flex;flex-direction:column;min-width:0;}
  .topbar{height:60px;background:hsl(var(--card));border-bottom:1px solid hsl(var(--border));display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20;}
  .topbar .page-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .co-badge{font-size:12px;font-weight:600;background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));padding:6px 12px;border-radius:20px;}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
  .avatar{width:30px;height:30px;border-radius:50%;background:hsl(var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .logout-btn{font-size:12.5px;font-weight:600;color:hsl(var(--muted-foreground));border:1px solid hsl(var(--border));background:hsl(var(--card));padding:6px 12px;border-radius:8px;}
  .logout-btn:hover{background:hsl(var(--muted));}

  .content{padding:24px 26px 60px;max-width:1400px;width:100%;margin:0 auto;}

  /* ---------- generic components ---------- */
  .card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);}
  .card-pad{padding:20px;}
  .grid{display:grid;gap:16px;}
  .kpi{padding:18px 20px;border-radius:var(--radius);border:1px solid hsl(var(--border));background:hsl(var(--card));}
  .kpi .label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--muted-foreground));}
  .kpi .value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:6px;}
  .kpi .sub{font-size:12px;color:hsl(var(--muted-foreground));margin-top:4px;}

  .btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid transparent;transition:.15s;white-space:nowrap;}
  .btn-primary{background:hsl(var(--primary));color:#fff;}
  .btn-primary:hover{background:hsl(230 50% 44%);}
  .btn-accent{background:hsl(var(--accent));color:#fff;}
  .btn-accent:hover{background:hsl(204 70% 44%);}
  .btn-outline{background:hsl(var(--card));border-color:hsl(var(--border));color:hsl(var(--foreground));}
  .btn-outline:hover{background:hsl(var(--muted));}
  .btn-ghost{background:transparent;color:hsl(var(--muted-foreground));}
  .btn-ghost:hover{background:hsl(var(--muted));}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
  .btn-danger{background:hsl(var(--destructive));color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .section-head h1{font-size:21px;margin:0;}
  .section-head p{margin:4px 0 0;color:hsl(var(--muted-foreground));font-size:13.5px;max-width:640px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--muted-foreground));font-weight:700;padding:10px 12px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--muted)/.4);white-space:nowrap;}
  tbody td{padding:10px 12px;border-bottom:1px solid hsl(var(--border));vertical-align:middle;}
  tbody tr:hover{background:hsl(var(--muted)/.35);}
  tbody tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid hsl(var(--border));}
  .table-wrap table{border:none;}
  .table-wrap .card-pad-head{padding:16px 18px;border-bottom:1px solid hsl(var(--border));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}

  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:20px;letter-spacing:.02em;}
  .badge-green{background:hsl(var(--success)/.12);color:hsl(var(--success));}
  .badge-blue{background:hsl(var(--accent)/.12);color:hsl(var(--accent));}
  .badge-amber{background:hsl(var(--warning)/.15);color:hsl(30 80% 38%);}
  .badge-red{background:hsl(var(--destructive)/.1);color:hsl(var(--destructive));}
  .badge-gray{background:hsl(var(--muted));color:hsl(var(--muted-foreground));}

  label.field-label{display:block;font-size:11.5px;font-weight:700;color:hsl(var(--muted-foreground));text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
  .input, select.input, textarea.input{width:100%;padding:9px 11px;border:1px solid hsl(var(--input));border-radius:8px;font-size:13.5px;background:hsl(var(--card));color:hsl(var(--foreground));}
  .input:focus, select.input:focus{outline:none;border-color:hsl(var(--ring));box-shadow:0 0 0 3px hsl(var(--ring)/.15);}
  .field{margin-bottom:14px;}
  .field-row{display:grid;gap:14px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid hsl(var(--border));margin-bottom:18px;flex-wrap:wrap;}
  .tab-btn{padding:10px 16px;font-size:13px;font-weight:600;color:hsl(var(--muted-foreground));border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:hsl(var(--primary));border-bottom-color:hsl(var(--primary));}
  .tab-btn:hover{color:hsl(var(--foreground));}

  .modal-backdrop{position:fixed;inset:0;background:hsla(230,45%,10%,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
  .modal{background:hsl(var(--card));border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal.modal-lg{max-width:840px;}
  .modal-head{padding:18px 22px;border-bottom:1px solid hsl(var(--border));display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:16px;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid hsl(var(--border));display:flex;justify-content:flex-end;gap:10px;}
  .icon-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:hsl(var(--muted-foreground));}
  .icon-btn:hover{background:hsl(var(--muted));}

  .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{background:hsl(230 45% 16%);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;animation:toastin .18s ease-out;}
  @keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

  .stepper{display:flex;align-items:center;margin-bottom:24px;overflow-x:auto;padding-bottom:4px;}
  .step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:88px;position:relative;}
  .step .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid hsl(var(--border));color:hsl(var(--muted-foreground));background:hsl(var(--card));}
  .step.done .dot{background:hsl(var(--success));border-color:hsl(var(--success));color:#fff;}
  .step.current .dot{background:hsl(var(--primary));border-color:hsl(var(--primary));color:#fff;box-shadow:0 0 0 4px hsl(var(--primary)/.15);}
  .step .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:hsl(var(--muted-foreground));text-align:center;line-height:1.2;}
  .step.current .lbl{color:hsl(var(--primary));}
  .step-line{flex:1;height:2px;background:hsl(var(--border));margin:0 2px 22px;min-width:16px;}
  .step-line.done{background:hsl(var(--success));}

  .empty-state{padding:40px 20px;text-align:center;color:hsl(var(--muted-foreground));}
  .pill-toggle{display:inline-flex;background:hsl(var(--muted));border-radius:9px;padding:3px;gap:2px;}
  .pill-toggle button{padding:6px 13px;font-size:12.5px;font-weight:600;border-radius:7px;color:hsl(var(--muted-foreground));}
  .pill-toggle button.active{background:hsl(var(--card));color:hsl(var(--foreground));box-shadow:0 1px 2px rgba(0,0,0,.08);}

  .note-banner{display:flex;gap:10px;background:hsl(var(--accent)/.08);border:1px solid hsl(var(--accent)/.25);border-radius:10px;padding:12px 14px;font-size:12.5px;color:hsl(230 40% 25%);margin-bottom:18px;}
  .note-banner svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:hsl(var(--accent));}

  .kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed hsl(var(--border));}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:hsl(var(--muted-foreground));}
  .kv .v{font-weight:700;}

  .filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;padding:14px 16px;background:hsl(var(--muted)/.4);border:1px solid hsl(var(--border));border-radius:10px;}
  .filter-field{display:flex;flex-direction:column;gap:4px;min-width:150px;}
  .filter-field label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:hsl(var(--muted-foreground));}
  .filter-field .input{padding:7px 10px;font-size:12.5px;}
  .filter-actions{margin-left:auto;display:flex;gap:8px;align-items:flex-end;}
  .filter-count{font-size:11.5px;color:hsl(var(--muted-foreground));padding-bottom:9px;}
  .master-list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid hsl(var(--border));font-size:13.5px;}
  .master-list-item:last-child{border-bottom:none;}
  .formula-card{border:1px solid hsl(var(--border));border-radius:10px;padding:14px 16px;margin-bottom:12px;background:hsl(var(--card));}
  .formula-card.is-default{border-color:hsl(var(--primary)/.4);box-shadow:0 0 0 1px hsl(var(--primary)/.12);}
  .hint-banner{display:flex;gap:10px;background:hsl(var(--warning)/.12);border:1px solid hsl(var(--warning)/.35);border-radius:10px;padding:12px 14px;font-size:12.5px;color:hsl(30 70% 30%);margin-bottom:16px;align-items:center;}
  .hint-banner svg{width:16px;height:16px;flex-shrink:0;color:hsl(var(--warning));}
  .chip-box{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:6px 8px;border:1px solid hsl(var(--input));border-radius:8px;background:hsl(var(--card));margin-bottom:8px;align-items:center;}
  .chip-box:empty::before{content:'No materials selected';font-size:12.5px;color:hsl(var(--muted-foreground));}
  .chip{display:inline-flex;align-items:center;gap:6px;background:hsl(var(--accent)/.12);color:hsl(var(--accent));font-size:12px;font-weight:600;padding:3px 5px 3px 10px;border-radius:20px;}
  .chip button{border:none;background:transparent;color:inherit;font-size:15px;line-height:1;padding:0 4px;cursor:pointer;border-radius:50%;}
  .chip button:hover{background:hsl(var(--accent)/.2);}
  .chip-list{display:flex;flex-wrap:wrap;gap:4px;}
  .chip-static{display:inline-block;background:hsl(var(--accent)/.1);color:hsl(var(--accent));font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
  .req{color:hsl(var(--destructive));margin-left:2px;font-weight:700;}
  .field-hint{font-size:11.5px;color:hsl(var(--muted-foreground));margin-top:4px;}
  .field-error{font-size:12px;color:hsl(var(--destructive));margin-top:4px;font-weight:600;}
  .lock-note{display:flex;gap:6px;align-items:center;font-size:11.5px;color:hsl(30 70% 32%);margin-top:4px;font-weight:600;}
  .input:disabled{background:hsl(var(--muted));color:hsl(var(--muted-foreground));cursor:not-allowed;}
  .batch-ids{display:flex;flex-wrap:wrap;gap:4px;}
  @media print{
    .sidebar,.topbar,.no-print,.modal-backdrop{display:none !important;}
    .shell{display:block;}
    .content{max-width:100%;padding:0;}
    body{background:#fff;}
  }
  @media (max-width:900px){
    .shell{grid-template-columns:1fr;}
    .sidebar{position:fixed;left:-260px;z-index:60;width:250px;transition:.2s;}
    .sidebar.open{left:0;}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <div class="card" style="width:100%;max-width:420px;padding:0;overflow:hidden;">
    <div style="background:linear-gradient(135deg,hsl(230 50% 48%),hsl(204 65% 45%));padding:26px 28px;color:#fff;">
      <div style="width:40px;height:40px;border-radius:10px;background:hsla(0,0%,100%,.18);display:flex;align-items:center;justify-content:center;margin-bottom:12px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
      </div>
      <div class="font-headline" style="font-size:19px;font-weight:700;">Inventory ERP</div>
      <div style="font-size:12.5px;opacity:.85;margin-top:2px;">Phase 1 · Batch-wise Inventory &amp; Production Consumption</div>
    </div>
    <div style="padding:26px 28px 28px;">
      <div id="login-step-company">
        <div class="field-label" style="margin-bottom:10px;">Select company</div>
        <div id="company-list" style="display:flex;flex-direction:column;gap:10px;"></div>
      </div>
      <div id="login-step-credentials" style="display:none;">
        <button class="btn btn-ghost btn-sm" id="back-to-company" style="padding-left:0;margin-bottom:12px;">&larr; Change company</button>
        <div id="selected-co-banner" class="co-badge" style="display:block;margin-bottom:16px;"></div>
        <div class="field">
          <label class="field-label">Username</label>
          <input class="input" id="login-user" placeholder="e.g. admin" value="admin" />
        </div>
        <div class="field">
          <label class="field-label">Password</label>
          <input class="input" type="password" id="login-pass" placeholder="••••••••" value="••••••••" />
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;" id="do-login">Login</button>
        <div style="font-size:11.5px;color:hsl(var(--muted-foreground));margin-top:12px;text-align:center;">Prototype build — any credentials will work.</div>
      </div>
    </div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="icon-btn no-print" id="mobile-nav-toggle" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div class="page-title" id="page-title">Dashboard</div>
        </div>
        <div class="topbar-right">
          <div class="co-badge" id="topbar-co"></div>
          <div class="user-chip"><div class="avatar" id="user-avatar">A</div><span id="user-name-label">admin</span></div>
          <button class="logout-btn" id="logout-btn">Log out</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
/* =====================================================================
   D.C DYES & PIGMENTS — PHASE 1 INVENTORY ERP PROTOTYPE (v2)
   Single-file interactive mock. In-memory data only (resets on reload).
   Scope follows MOM: 11 Sep 2026 — Revised Phase 1 Inventory Scope.
   v2 adds: Category/Unit masters, versioned formulas, packaging inward,
   table filters (Supplier/RM ledger/Packaging inventory/RM inward),
   auto-generated batch numbers, and an insufficient-stock shortcut
   from Production Entry straight into Raw Material Inward.
   ===================================================================== */

/* ---------------------------- ICONS ---------------------------- */
const ICONS = {
  dashboard:'<path d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zM13 3v6h8V3h-8z"/>',
  supplier:'<path d="M3 3h13v13H3zM16 8h5l3 3v5h-8V8z"/><circle cx="7.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/>',
  rawmat:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  inward:'<path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 21h16"/>',
  ledger:'<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/>',
  packaging:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  product:'<path d="M20.59 13.41L12 22l-9-9V4h9l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  formula:'<path d="M9 3h6M10 3v5.2L5.5 17a1.8 1.8 0 001.6 2.6h9.8a1.8 1.8 0 001.6-2.6L14 8.2V3"/>',
  production:'<rect x="3" y="10" width="4" height="10"/><rect x="10" y="6" width="4" height="14"/><rect x="17" y="13" width="4" height="7"/>',

/* ---------------------------- HELPERS ---------------------------- */
let SEQ = {};
function nextSeq(key){ SEQ[key]=(SEQ[key]||0)+1; return SEQ[key]; }
function pad(n,w){ n=String(n); while(n.length<w) n='0'+n; return n; }
function fmtNum(n,d=2){ if(n===undefined||n===null||isNaN(n)) return '0'; return Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtInt(n){ if(n===undefined||n===null||isNaN(n)) return '0'; return Number(n).toLocaleString('en-IN'); }
function money(n){ return '₹' + fmtNum(n,2); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function toKg(qty, unit){
  unit = (unit||'kg').toLowerCase();
  if(unit==='g'||unit==='gm'||unit==='gram'||unit==='grams') return qty/1000;
  if(unit==='kg') return qty;
  return qty;
}
function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* ---- generic rowspan-table helper, used by drill-down hierarchy reports ---- */
function samePrefix(a,b,col){ for(let k=0;k<=col;k++){ if(a[k]!==b[k]) return false; } return true; }
function computeSpans(paths, numCols){
  const spans = paths.map(()=> new Array(numCols).fill(1));
  for(let col=0; col<numCols; col++){
    let i=0;
    while(i<paths.length){
      let j=i+1;
      while(j<paths.length && samePrefix(paths[i],paths[j],col)) j++;
      spans[i][col] = j-i;
      for(let k=i+1;k<j;k++) spans[k][col]=0;
      i=j;
    }
  }
  return spans;
}
/** rows: array of {path:[...strings], cells:[...html for trailing/leaf columns]}
 *  Sorted by path first (required so identical prefixes are adjacent), then rendered
 *  with rowspan on the first `path.length` columns, followed by the leaf `cells`. */
function renderSpannedTable(headers, rows, numSpanCols){
  if(rows.length===0) return `<div class="empty-state">No data matches the current filters.</div>`;
  const sorted = [...rows].sort((a,b)=>{
    for(let i=0;i<numSpanCols;i++){ if(a.path[i]!==b.path[i]) return String(a.path[i]).localeCompare(String(b.path[i])); }
    return 0;
  });
  const spans = computeSpans(sorted.map(r=>r.path), numSpanCols);
  const bodyRows = sorted.map((r,i)=>{
    let tds = '';
    for(let c=0;c<numSpanCols;c++){
      if(spans[i][c]>0) tds += `<td rowspan="${spans[i][c]}" style="vertical-align:top;${c===0?'font-weight:700;':''}">${r.path[c]}</td>`;
    }
    tds += r.cells.map(c=>`<td>${c}</td>`).join('');
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${bodyRows}</tbody></table></div>`;
}
/* ---- Material / Item codes and Batch IDs ----
 *  RM Batch ID  : RM-[MATERIAL CODE]-[4-digit sequence]   e.g. RM-UMB-0001
 *  PKG Batch ID : PKG-[ITEM CODE]-[4-digit sequence]      e.g. PKG-HDPE-0001
 *  The sequence runs separately per code, is never reused and never editable. */
function normalizeCode(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5); }
function isValidCode(s){ return /^[A-Z0-9]{2,5}$/.test(s); }
function batchSeqKey(kind, code){ return kind+'-'+code; }          // kind: 'RM' | 'PKG'
function formatBatchId(kind, code, n){ return `${kind}-${code}-${pad(n,4)}`; }
/** next sequence number that WILL be used for this code (does not consume it) */
function peekBatchSeq(kind, code){ return ((db().batchSeq||{})[batchSeqKey(kind,code)]||0) + 1; }
/** consume and return the next Batch ID for this code */
function takeBatchId(kind, code){
  const d = db();
  const k = batchSeqKey(kind, code);
  d.batchSeq[k] = (d.batchSeq[k]||0) + 1;
  return formatBatchId(kind, code, d.batchSeq[k]);
}
/** Build the batchSeq counters from already-existing batch IDs (used for seed data) */
function buildBatchSeq(rmBatches, pkgBatches){
  const seq = {};
  const scan = (list, kind)=> list.forEach(b=>{
    const m = String(b.batchNo).match(/^(RM|PKG)-([A-Z0-9]+)-(\d{4})$/);
    if(m && m[1]===kind){ const k = batchSeqKey(kind, m[2]); seq[k] = Math.max(seq[k]||0, parseInt(m[3],10)); }
  });
  scan(rmBatches,'RM'); scan(pkgBatches,'PKG');
  return seq;
}
/** A code identifies one material/item NAME (its grades / sizes / brands share it,
 *  because Batch IDs do not carry grade, size or brand). Returns an error string or ''. */
function validateItemCode(code, name, list, selfId, label){
  if(!code) return `${label} is required`;
  if(!isValidCode(code)) return `${label} must be 2–5 characters, uppercase letters/numbers only`;
  const nm = String(name||'').trim().toLowerCase();
  const codeOwner = list.find(x=>x.id!==selfId && (x.code||'')===code && x.name.trim().toLowerCase()!==nm);
  if(codeOwner) return `${label} "${code}" is already used by "${codeOwner.name}"`;
  const sameName = list.find(x=>x.id!==selfId && x.name.trim().toLowerCase()===nm && (x.code||'')!==code);
  if(sameName) return `"${sameName.name}" already uses ${label.toLowerCase()} "${sameName.code}" — all its grades/variants must share it`;
  return '';
}

function batchChips(list){
  const uniq = [...new Set(list)];
  return `<div class="batch-ids">${uniq.map(b=>`<span class="badge badge-gray" style="font-family:monospace;">${b}</span>`).join('')}</div>`;
}

function toast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = (kind==='error'? icon('alert','') : icon('check','')) + `<span>${escapeHtml(msg)}</span>`;
  el.querySelector('svg').style.width='15px'; el.querySelector('svg').style.height='15px'; el.querySelector('svg').style.flexShrink='0';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='.25s'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),250); }, 2600);
}

/* =====================================================================
   Packaging Formula Master — multilevel packaging chains.
   A formula record = {id, label, baseItemId, parentItemId, qtyPerParent}
   meaning: qtyPerParent units of baseItemId go into ONE unit of parentItemId.
   A "configuration" (selectable in Production) is either:
     - a DIRECT item: a packaging item never used as a baseItemId anywhere
       (nothing feeds into it) — used standalone via its own packCapacity.
     - a CHAIN starting at one formula record whose parentItemId is the
       outer/final unit for this run; the chain resolves downward by
       repeatedly finding the record whose parentItemId === the current
       record's baseItemId, until no further record feeds in (the
       smallest/terminal base, which must carry packCapacity).
   ===================================================================== */
function pkgFormulas(){ return db().packagingFormulas || []; }
function formulasForBase(baseItemId){ return pkgFormulas().filter(f=>f.baseItemId===baseItemId); }
function formulasForParent(parentItemId){ return pkgFormulas().filter(f=>f.parentItemId===parentItemId); }
function isUsedAsBase(itemId){ return pkgFormulas().some(f=>f.baseItemId===itemId); }
/** Everywhere a packaging item appears in the formula master, as base or parent — used for the Packaging Master "Used in Formulas" indicator. */
function formulasInvolving(itemId){
  return pkgFormulas().filter(f=>f.baseItemId===itemId || f.parentItemId===itemId)
    .map(f=>({id:f.id, label:f.label, role: f.baseItemId===itemId ? 'as base' : 'as parent'}));
}
/** Resolve the full chain (outer → inner) starting from one top formula record. */
function resolveChainFromFormula(topFormulaId){
  const chain = [];
  let current = pkgFormulas().find(f=>f.id===topFormulaId);
  const seen = new Set();
  while(current && !seen.has(current.id)){
    seen.add(current.id);
    chain.push(current);
    current = formulasForParent(current.baseItemId)[0] || null; // deeper level, if the base is itself fed by something
  }
  return chain; // chain[0].parentItemId = outermost; chain[last].baseItemId = innermost/smallest base
}
/** Every selectable packaging configuration for a given product (or all, if productId omitted).
 *  type 'direct': a standalone item with its own packCapacity, no formula chain.
 *  type 'chain' : a formula-driven multi-level configuration. */
function buildPackagingConfigurations(productId){
  const d = db();
  const configs = [];
  d.packagingMaterials.forEach(m=>{
    if(isUsedAsBase(m.id)) return; // only items nothing feeds into can be used "directly"
    if(productId && !pkgAppliesToProduct(m, productId)) return;
    configs.push({id:'direct|'+m.id, type:'direct', label:`${m.name} — Direct`, outerItemId:m.id});
  });
  pkgFormulas().forEach(f=>{
    // Every formula record is independently selectable by its own label — e.g. "20kg Carton via
    // 1kg Inner" stays choosable even though Carton can ALSO be chained further up into a Container
    // via a separate record. Chain resolution always walks downward only from the record picked.
    const outer = d.packagingMaterials.find(x=>x.id===f.parentItemId);
    if(!outer) return;
    if(productId && !pkgAppliesToProduct(outer, productId)) return;
    configs.push({id:'chain|'+f.id, type:'chain', label:f.label, outerItemId:f.parentItemId, topFormulaId:f.id});
  });
  return configs;
}
/** Resolve a configuration into an ordered levels array, outer → inner:
 *  [{itemId, qtyPerParentAbove (null for outermost), cumUnitsPerOuter}]
 *  cumUnitsPerOuter[i] = how many units of level i make up ONE outermost unit. */
function resolveConfigLevels(config){
  const d = db();
  if(config.type==='direct'){
    return [{itemId:config.outerItemId, qtyPerParentAbove:null, cumUnitsPerOuter:1}];
  }
  const chain = resolveChainFromFormula(config.topFormulaId);
  const levels = [{itemId:chain[0].parentItemId, qtyPerParentAbove:null, cumUnitsPerOuter:1}];
  let cum = 1;
  chain.forEach(f=>{
    cum = cum * f.qtyPerParent;
    levels.push({itemId:f.baseItemId, qtyPerParentAbove:f.qtyPerParent, cumUnitsPerOuter:cum});
  });
  return levels;
}
/** Convert a quantity expressed at one level of a resolved-levels array to the equivalent at another level. */
function convertBetweenLevels(levels, fromIdx, toIdx, qty){
  return qty * (levels[toIdx].cumUnitsPerOuter / levels[fromIdx].cumUnitsPerOuter);
}

function fgSoldQty(fgId){ return db().sales.filter(s=>s.fgId===fgId).reduce((s,x)=>s+x.qty,0); }

  const sold = fgSoldQty(fg.id);

}

    document.getElementById('flt-city').addEventListener('change', e=>{ filters.city=e.target.value; softRedraw(); });
    document.getElementById('flt-material').addEventListener('change', e=>{ filters.material=e.target.value; softRedraw(); });
    document.getElementById('flt-clear').addEventListener('click', ()=>{ filters.search=''; filters.city=''; filters.material=''; draw(); });
    document.getElementById('add-supplier').addEventListener('click', openAddSupplierModal);
  }
  // Redraw only the table + count, keep focus in the active text filter
  function softRedraw(){
    const rows = d.suppliers.filter(matches);
    content.querySelector('.table-wrap tbody').innerHTML = rows.map(s=>`
      <tr><td><span class="badge badge-blue">${s.code}</span></td><td><strong>${s.name}</strong></td><td>${s.contact}</td><td>${s.phone}</td><td>${s.city}</td><td style="font-family:monospace;font-size:11.5px;">${s.gst}</td><td>${supplierMaterialChips(s)}</td></tr>
    `).join('') || `<tr><td colspan="7" class="empty-state">No suppliers match the current filters.</td></tr>`;
    content.querySelector('.filter-count').textContent = `${rows.length} of ${d.suppliers.length} suppliers`;
  }
  function openAddSupplierModal(){
    openModal(`
      <div class="modal-head"><h3>Add Supplier</h3><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
      <div class="modal-body">
        <div class="field-row" style="grid-template-columns:1fr 1fr;">
          <div class="field"><label class="field-label">Supplier Name</label><input class="input" id="f-name" placeholder="e.g. Shree Enterprises" /></div>
          <div class="field"><label class="field-label">Contact Person</label><input class="input" id="f-contact" /></div>
        </div>
        <div class="field-row" style="grid-template-columns:1fr 1fr;">
          <div class="field"><label class="field-label">Phone</label><input class="input" id="f-phone" /></div>
          <div class="field"><label class="field-label">City</label><input class="input" id="f-city" /></div>
        </div>
        <div class="field"><label class="field-label">GSTIN</label><input class="input" id="f-gst" /></div>
        <div class="field">
          <label class="field-label">Materials Supplied</label>
          <div class="chip-box" id="ms-chips"></div>
          <select class="input" id="ms-select"></select>
          <div class="field-hint">Choose from the Raw Material Master — a supplier can supply several materials. Missing a material? Add it in the Raw Material Master first.</div>
        </div>
      </div>
      <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="save-supplier">Save Supplier</button></div>
    `);
    const selectedMats = [];
    function drawMatPicker(){
      document.getElementById('ms-chips').innerHTML = selectedMats.map(id=>`<span class="chip">${matName(id)}<button type="button" data-rm="${id}" title="Remove">&times;</button></span>`).join('');
      const remaining = d.rawMaterials.filter(m=>!selectedMats.includes(m.id));
      document.getElementById('ms-select').innerHTML = `<option value="">${remaining.length? '+ Add material…' : 'All materials selected'}</option>` + remaining.map(m=>`<option value="${m.id}">${m.name} (${m.shortCode}-${m.grade})</option>`).join('');
      document.querySelectorAll('#ms-chips [data-rm]').forEach(b=>b.addEventListener('click', ()=>{
        selectedMats.splice(selectedMats.indexOf(b.getAttribute('data-rm')),1); drawMatPicker();
      }));
    }
    drawMatPicker();
    document.getElementById('ms-select').addEventListener('change', e=>{
      if(e.target.value){ selectedMats.push(e.target.value); drawMatPicker(); }
    });
    document.getElementById('save-supplier').addEventListener('click', ()=>{
      const name = document.getElementById('f-name').value.trim();
      if(!name){ toast('Supplier name is required','error'); return; }
      const n = nextSeq(STATE.companyId+'-sup')+ d.suppliers.length;
      const code = 'SUP-'+pad(n+100,3);
      d.suppliers.push({id:code, code, name, contact:document.getElementById('f-contact').value||'—', phone:document.getElementById('f-phone').value||'—', city:document.getElementById('f-city').value||'—', gst:document.getElementById('f-gst').value||'—', materialIds:[...selectedMats]});
      closeModal(); toast('Supplier added'); draw();
    });
  }
  draw();
}

/* ================= RAW MATERIAL MASTER ================= */
function renderRawMaterials(){
  const d = db();
  const filters = {search:'', category:''};
  const content = document.getElementById('content');
  function matches(m){
    if(filters.search){
      const q = filters.search.toLowerCase();
      if(!(m.name.toLowerCase().includes(q) || m.shortCode.toLowerCase().includes(q) || m.grade.toLowerCase().includes(q))) return false;
    }
    if(filters.category && m.category!==filters.category) return false;
    return true;
  }
  function draw(){
    const rows = d.rawMaterials.filter(matches);
    content.innerHTML = `
      <div class="section-head">
        <div><h1>Raw Material Master</h1><p>Material, code, grade, unit and reorder level. The Material Code is mandatory — it forms part of every Batch ID (RM-CODE-0001). Stock and value below are computed live from batch-wise inventory. Category and Unit are managed centrally in their own masters.</p></div>
        <button class="btn btn-primary" id="add-rm">${icon('plus')} Add Raw Material</button>
      </div>
      <div class="filter-bar no-print">
        <div class="filter-field" style="min-width:220px;"><label>Search (name / code / grade)</label><input class="input" id="rmf-search" placeholder="e.g. UMB" value="${escapeHtml(filters.search)}" /></div>
        <div class="filter-field"><label>Category</label><select class="input" id="rmf-cat">${selectOptions(filters.category, d.categories.map(c=>({value:c,label:c})))}</select></div>
        <div class="filter-actions"><span class="filter-count">${rows.length} of ${d.rawMaterials.length} materials</span><button class="btn btn-outline btn-sm" id="rmf-clear">Clear Filters</button></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Material</th><th>Material Code</th><th>Grade</th><th>Category</th><th>Unit</th><th>Current Stock</th><th>Avg Rate</th><th>Stock Value</th><th>Min Level</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${rows.map(m=>{
              const stock = rmStock(m.id); const low = stock<=m.minStock;
              const locked = rmCodeLocked(m.shortCode);
              return `<tr>
                <td><strong>${m.name}</strong></td>
                <td><span class="badge badge-blue">${m.shortCode}</span>${locked?` <span title="Locked — inward entries exist" style="font-size:11px;">&#128274;</span>`:''}</td>
                <td><span class="badge badge-gray">${m.grade}</span></td>
                <td>${m.category}</td><td>${m.unit}</td>
                <td>${fmtNum(stock,1)} ${m.unit}</td>
                <td>${money(rmAvgRate(m.id))}</td>
                <td>${money(rmStockValue(m.id))}</td>
                <td>${fmtNum(m.minStock,1)} ${m.unit}</td>
                <td>${low?'<span class="badge badge-red">Low Stock</span>':'<span class="badge badge-green">OK</span>'}</td>
                <td><button class="icon-btn" data-edit-rm="${m.id}" title="Edit">${icon('edit')}</button></td>
              </tr>`;
            }).join('') || `<tr><td colspan="11" class="empty-state">No raw materials match the current filters.</td></tr>`}
          </tbody>
        </table>
      </div>
    `;
    document.getElementById('rmf-search').addEventListener('input', e=>{ filters.search=e.target.value; draw(); const el=document.getElementById('rmf-search'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); });
    document.getElementById('rmf-cat').addEventListener('change', e=>{ filters.category=e.target.value; draw(); });
    document.getElementById('rmf-clear').addEventListener('click', ()=>{ filters.search=''; filters.category=''; draw(); });
    document.getElementById('add-rm').addEventListener('click', ()=> openRmModal(null));
    content.querySelectorAll('[data-edit-rm]').forEach(b=>b.addEventListener('click', ()=> openRmModal(b.getAttribute('data-edit-rm'))));
  }

  /** existingId === null -> add; otherwise edit that record */
  function openRmModal(existingId){
    const ex = existingId ? d.rawMaterials.find(m=>m.id===existingId) : null;
    const locked = ex ? rmCodeLocked(ex.shortCode) : false;
    openModal(`
      <div class="modal-head"><h3>${ex?'Edit Raw Material':'Add Raw Material'}</h3><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
      <div class="modal-body">
        <div class="field-row" style="grid-template-columns:2fr 1fr;">
          <div class="field"><label class="field-label">Material Name<span class="req">*</span></label><input class="input" id="f-name" placeholder="e.g. Zinc Oxide" value="${ex?escapeHtml(ex.name):''}" /></div>
          <div class="field">
            <label class="field-label">Material Code<span class="req">*</span></label>
            <input class="input" id="f-code" placeholder="e.g. ZNO" maxlength="5" value="${ex?escapeHtml(ex.shortCode):''}" ${locked?'disabled':''} style="text-transform:uppercase;" />
          </div>
        </div>
        <div id="f-code-msg"></div>
        ${locked ? `<div class="lock-note">&#128274; Code is locked — inward entries exist for this material, and the code is part of their Batch IDs.</div>` : `<div class="field-hint" style="margin-top:-6px;margin-bottom:10px;">2–5 characters, uppercase letters/numbers only. Used in the Batch ID, e.g. <strong>RM-<span id="f-code-preview">${ex?escapeHtml(ex.shortCode):'CODE'}</span>-0001</strong>. Grades of the same material share one code.</div>`}
        <div class="field-row" style="grid-template-columns:1fr 1fr 1fr;">
          <div class="field"><label class="field-label">Grade</label><input class="input" id="f-grade" placeholder="STD" value="${ex?escapeHtml(ex.grade):''}" /></div>
          <div class="field"><label class="field-label">Category</label><select class="input" id="f-cat">${d.categories.map(c=>`<option value="${c}" ${ex&&ex.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
          <div class="field"><label class="field-label">Unit</label><select class="input" id="f-unit">${d.units.map(u=>`<option value="${u}" ${ex&&ex.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label class="field-label">Minimum Stock Level</label><input class="input" type="number" id="f-min" value="${ex?ex.minStock:100}" /></div>
        <div class="note-banner" style="margin:6px 0 0;">${icon('info')}<div>Need a new category or unit? Add it in Category Master / Unit Master first, then it will show up here.</div></div>
      </div>
      <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="save-rm">${ex?'Save Changes':'Save Material'}</button></div>
    `);
    const codeEl = document.getElementById('f-code');
    const nameEl = document.getElementById('f-name');
    function showErr(msg){ document.getElementById('f-code-msg').innerHTML = msg? `<div class="field-error" style="margin:-8px 0 8px;">${escapeHtml(msg)}</div>` : ''; }
    codeEl.addEventListener('input', ()=>{
      const pos = codeEl.value; codeEl.value = normalizeCode(pos);
      const pv = document.getElementById('f-code-preview'); if(pv) pv.textContent = codeEl.value || 'CODE';
      showErr('');
    });
    // typing a name that already exists pre-fills that material's code (same name => same code)
    nameEl.addEventListener('input', ()=>{
      if(locked || codeEl.value) return;
      const same = d.rawMaterials.find(m=>m.id!==(ex&&ex.id) && m.name.trim().toLowerCase()===nameEl.value.trim().toLowerCase());
      if(same){ codeEl.value = same.shortCode; const pv=document.getElementById('f-code-preview'); if(pv) pv.textContent=same.shortCode; }
    });
    document.getElementById('save-rm').addEventListener('click', ()=>{
      const name = nameEl.value.trim();
      const code = locked ? ex.shortCode : normalizeCode(codeEl.value);
      if(!name){ toast('Material name is required','error'); return; }
      const err = validateItemCode(code, name, d.rawMaterials.map(m=>({id:m.id,name:m.name,code:m.shortCode})), ex&&ex.id, 'Material Code');
      if(err){ showErr(err); toast(err,'error'); return; }
      const grade = document.getElementById('f-grade').value.trim()||'STD';
      const rec = {name, shortCode:code, grade, unit:document.getElementById('f-unit').value, category:document.getElementById('f-cat').value, minStock:parseFloat(document.getElementById('f-min').value)||0};
      if(ex){ Object.assign(ex, rec); closeModal(); toast('Raw material updated'); draw(); return; }
      const id = 'RM-'+code+'-'+grade;
      if(d.rawMaterials.some(m=>m.id===id)){ toast('This material code + grade combination already exists','error'); return; }
      d.rawMaterials.push({id, ...rec, supplierIds:[]});
      closeModal(); toast('Raw material added'); draw();
    });
  }
  draw();
}

/* ================= PACKAGING MASTER ================= */
function renderPackagingMaster(){
  const d = db();
  const filters = {item:'', productId:'', size:'', brand:'', universal:''};
  const content = document.getElementById('content');
  function matches(m){
    if(filters.item){
      const q = filters.item.toLowerCase();
      if(!(m.name.toLowerCase().includes(q) || (m.itemCode||'').toLowerCase().includes(q))) return false;
    }
    if(filters.productId && !(m.universal || m.productId===filters.productId)) return false;
    if(filters.size && m.size!==filters.size) return false;
    if(filters.brand && m.brand!==filters.brand) return false;
    if(filters.universal==='yes' && !m.universal) return false;
    if(filters.universal==='no' && m.universal) return false;
    return true;
  }
  function draw(){
    const sizes = [...new Set(d.packagingMaterials.map(m=>m.size))].map(s=>({value:s,label:s}));
    const brands = [...new Set(d.packagingMaterials.map(m=>m.brand))].map(b=>({value:b,label:b}));
    const rows = d.packagingMaterials.filter(matches);
    content.innerHTML = `
      <div class="section-head">
        <div><h1>Packaging Material Master</h1><p>Each Item + Product + Size + Brand combination is its own SKU. The Item Code is mandatory — it forms part of every Batch ID (PKG-CODE-0001). <strong>Universal</strong> items are available for every product rather than one specific product. Pack Capacity only matters for items used as the smallest/base unit of a packing configuration — see <strong>Packaging Formula Master</strong>.</p></div>
        <button class="btn btn-primary" id="add-pkg">${icon('plus')} Add Packaging Material</button>
      </div>
      <div class="filter-bar no-print">
        <div class="filter-field"><label>Item Name / Code</label><input class="input" id="pmf-item" placeholder="search item or code" value="${escapeHtml(filters.item)}" /></div>
        <div class="filter-field"><label>Product</label><select class="input" id="pmf-prod">${selectOptions(filters.productId, d.products.map(p=>({value:p.id,label:p.grade+' — '+p.name})))}</select></div>
        <div class="filter-field"><label>Size</label><select class="input" id="pmf-size">${selectOptions(filters.size, sizes)}</select></div>
        <div class="filter-field"><label>Brand</label><select class="input" id="pmf-brand">${selectOptions(filters.brand, brands)}</select></div>
        <div class="filter-field"><label>Universal</label><select class="input" id="pmf-univ"><option value="">All</option><option value="yes" ${filters.universal==='yes'?'selected':''}>Yes</option><option value="no" ${filters.universal==='no'?'selected':''}>No</option></select></div>
        <div class="filter-actions"><span class="filter-count">${rows.length} of ${d.packagingMaterials.length} SKUs</span><button class="btn btn-outline btn-sm" id="pmf-clear">Clear Filters</button></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item</th><th>Item Code</th><th>Universal</th><th>Product</th><th>Size</th><th>Brand</th><th>Pack Capacity</th><th>Used in Formulas</th><th>Stock Unit</th><th>Usage Unit</th><th>Conversion Rule</th><th>Current Stock</th><th>Stock Value</th><th>Min Level</th><th></th></tr></thead>
          <tbody>
            ${rows.map(m=>{
              const used = formulasInvolving(m.id);
              return `
              <tr>
                <td><strong>${m.name}</strong></td>
                <td><span class="badge badge-blue">${m.itemCode||'—'}</span>${pkgCodeLocked(m.itemCode)?` <span title="Locked — inward entries exist" style="font-size:11px;">&#128274;</span>`:''}</td>
                <td>${m.universal? '<span class="badge badge-green">Universal</span>' : '<span class="badge badge-gray">No</span>'}</td>
                <td>${m.universal? '<span style="color:hsl(var(--muted-foreground));">All products</span>' : prodName(m.productId)}</td>
                <td>${m.size}</td>
                <td>${m.brand}</td>
                <td>${m.packCapacity? fmtNum(m.packCapacity,2)+' kg' : '<span style="color:hsl(var(--muted-foreground));">—</span>'}</td>
                <td>${used.length? `<span class="badge badge-blue">${used.length} formula${used.length>1?'s':''}</span>` : '<span style="color:hsl(var(--muted-foreground));">—</span>'}</td>
                <td>${m.unit}</td>
                <td>${m.usageUnit}</td>
                <td>${m.unit===m.usageUnit ? '<span class="badge badge-gray">1:1</span>' : `<span class="badge badge-blue">${m.convQtyPerUsage} ${m.unit} / ${m.usageUnit.slice(0,-1)||m.usageUnit}</span>`}</td>
                <td>${fmtNum(pkgStock(m.id),1)} ${m.unit}</td>
                <td>${money(pkgStockValue(m.id))}</td>
                <td>${fmtNum(m.minStock,1)} ${m.unit}</td>
                <td><button class="icon-btn" data-edit-pkg="${m.id}" title="Edit">${icon('edit')}</button></td>
              </tr>`;
            }).join('') || `<tr><td colspan="15" class="empty-state">No packaging items match the current filters.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="note-banner" style="margin-top:16px;">
        ${icon('info')}
        <div><strong>Example (Laminate Roll):</strong> stock is received and tracked in meters, but consumption is driven by the number of packets produced. The conversion rule (meters consumed per packet) auto-deducts the correct roll length whenever packaging is consumed in Production Entry. Stock is added through the <strong>Packaging Inward</strong> screen, batch-wise, the same way as raw material — see <strong>Packaging Inventory</strong> for the full Item → Product → Size → Brand → Supplier → Grade breakdown, and <strong>Packaging Formula Master</strong> for how items chain together (e.g. sachet → carton → container).</div>
      </div>
    `;
    document.getElementById('pmf-item').addEventListener('input', e=>{ filters.item=e.target.value; draw(); const el=document.getElementById('pmf-item'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); });
    document.getElementById('pmf-prod').addEventListener('change', e=>{ filters.productId=e.target.value; draw(); });
    document.getElementById('pmf-size').addEventListener('change', e=>{ filters.size=e.target.value; draw(); });
    document.getElementById('pmf-brand').addEventListener('change', e=>{ filters.brand=e.target.value; draw(); });
    document.getElementById('pmf-univ').addEventListener('change', e=>{ filters.universal=e.target.value; draw(); });
    document.getElementById('pmf-clear').addEventListener('click', ()=>{ filters.item=''; filters.productId=''; filters.size=''; filters.brand=''; filters.universal=''; draw(); });
    document.getElementById('add-pkg').addEventListener('click', ()=> openPkgModal(null));
    content.querySelectorAll('[data-edit-pkg]').forEach(b=>b.addEventListener('click', ()=> openPkgModal(b.getAttribute('data-edit-pkg'))));
  }

  function openPkgModal(existingId){
    const ex = existingId ? d.packagingMaterials.find(m=>m.id===existingId) : null;
    const locked = ex ? pkgCodeLocked(ex.itemCode) : false;
    const isUniv = ex ? !!ex.universal : false;
    const usedFormulas = ex ? formulasInvolving(ex.id) : [];
    openModal(`
      <div class="modal-head"><h3>${ex?'Edit Packaging Material':'Add Packaging Material'}</h3><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
      <div class="modal-body">
        <div class="field-row" style="grid-template-columns:2fr 1fr;">
          <div class="field"><label class="field-label">Item Name<span class="req">*</span></label><input class="input" id="f-name" placeholder="e.g. HDPE Bags" value="${ex?escapeHtml(ex.name):''}" /></div>
          <div class="field"><label class="field-label">Item Code<span class="req">*</span></label><input class="input" id="f-code" placeholder="e.g. HDPE" maxlength="5" value="${ex?escapeHtml(ex.itemCode||''):''}" ${locked?'disabled':''} style="text-transform:uppercase;" /></div>
        </div>

          <div class="field"><label class="field-label">Pack Capacity (kg) <span style="font-weight:400;color:hsl(var(--muted-foreground));">— only if used as a base unit</span></label><input class="input" type="number" min="0" step="0.01" id="f-cap" placeholder="e.g. 25 (leave blank if not a base unit)" value="${ex&&ex.packCapacity?ex.packCapacity:''}" /></div>
        </div>
        <div class="field-row" style="grid-template-columns:1fr 1fr;">
          <div class="field"><label class="field-label">Size</label><input class="input" id="f-size" placeholder="e.g. 20/30 inches" value="${ex?escapeHtml(ex.size):''}" /></div>
          <div class="field"><label class="field-label">Brand</label><input class="input" id="f-brand" placeholder="e.g. Tana Blue" value="${ex?escapeHtml(ex.brand):''}" /></div>
        </div>
        <div class="field-row" style="grid-template-columns:1fr 1fr;">
          <div class="field"><label class="field-label">Stock Unit</label><select class="input" id="f-unit">${d.units.map(u=>`<option value="${u}" ${ex&&ex.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
          <div class="field"><label class="field-label">Usage Unit</label><select class="input" id="f-uunit">${d.units.map(u=>`<option value="${u}" ${ex&&ex.usageUnit===u?'selected':''}>${u}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label class="field-label">Conversion (stock units consumed per 1 usage unit)</label><input class="input" type="number" step="0.01" id="f-conv" value="${ex?ex.convQtyPerUsage:1}" /></div>
        <div class="field"><label class="field-label">Minimum Stock Level</label><input class="input" type="number" id="f-min" value="${ex?ex.minStock:100}" /></div>
        ${ex? `<div class="field">
          <label class="field-label">Used in Formulas (read-only)</label>
          <div class="chip-box">${usedFormulas.length? usedFormulas.map(f=>`<span class="chip-static" data-formula-link="${f.id}" style="cursor:pointer;">${f.label} (${f.role})</span>`).join('') : ''}</div>
        </div>` : ''}
        <div class="note-banner" style="margin:6px 0 0;">${icon('info')}<div>Need a different unit? Add it in Unit Master first.</div></div>
      </div>
      <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="save-pkg">${ex?'Save Changes':'Save Item'}</button></div>
    `);
    document.querySelectorAll('[data-formula-link]').forEach(el=>el.addEventListener('click', ()=>{ closeModal(); navigate('packagingformulas'); }));

    document.querySelectorAll('#f-universal-toggle button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#f-universal-toggle button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        universalVal = btn.getAttribute('data-u')==='yes';
        document.getElementById('f-prod').disabled = universalVal;
      });
    });
    const codeEl = document.getElementById('f-code');
    const nameEl = document.getElementById('f-name');
    function showErr(msg){ document.getElementById('f-code-msg').innerHTML = msg? `<div class="field-error" style="margin:-8px 0 8px;">${escapeHtml(msg)}</div>` : ''; }
    codeEl.addEventListener('input', ()=>{
      codeEl.value = normalizeCode(codeEl.value);
      const pv = document.getElementById('f-code-preview'); if(pv) pv.textContent = codeEl.value || 'CODE';
      showErr('');
    });
    nameEl.addEventListener('input', ()=>{
      if(locked || codeEl.value) return;
      const same = d.packagingMaterials.find(m=>m.id!==(ex&&ex.id) && m.name.trim().toLowerCase()===nameEl.value.trim().toLowerCase());
      if(same){ codeEl.value = same.itemCode; const pv=document.getElementById('f-code-preview'); if(pv) pv.textContent=same.itemCode; }
    });
    document.getElementById('save-pkg').addEventListener('click', ()=>{
      const name = nameEl.value.trim();
      const code = locked ? ex.itemCode : normalizeCode(codeEl.value);
      if(!name){ toast('Item name is required','error'); return; }
      const err = validateItemCode(code, name, d.packagingMaterials.map(m=>({id:m.id,name:m.name,code:m.itemCode})), ex&&ex.id, 'Item Code');
      if(err){ showErr(err); toast(err,'error'); return; }
      const cap = parseFloat(document.getElementById('f-cap').value)||0;
      const rec = {
        name, itemCode:code, packCapacity:cap, universal:universalVal,
        productId: universalVal ? null : document.getElementById('f-prod').value,
        size:document.getElementById('f-size').value.trim()||'Standard',
        brand:document.getElementById('f-brand').value.trim()||'Generic',
        unit:document.getElementById('f-unit').value, usageUnit:document.getElementById('f-uunit').value,
        convQtyPerUsage:parseFloat(document.getElementById('f-conv').value)||1,
        minStock:parseFloat(document.getElementById('f-min').value)||0,
      };
      if(ex){ Object.assign(ex, rec); closeModal(); toast('Packaging material updated'); draw(); return; }
      const id='PKGM-'+code+'-'+nextSeq(STATE.companyId+'-pkgm');
      d.packagingMaterials.push({id, ...rec, supplierIds:[]});
      closeModal(); toast('Packaging material added'); draw();
    });
  }
  draw();
}

/* ================= PACKAGING FORMULA MASTER (multilevel packaging chains) ================= */
function renderPackagingFormulas(){
  const d = db();
  const filters = {baseItemId:'', parentItemId:''};
  const content = document.getElementById('content');
  function matches(f){
    if(filters.baseItemId && f.baseItemId!==filters.baseItemId) return false;
    if(filters.parentItemId && f.parentItemId!==filters.parentItemId) return false;
    return true;
  }
  function draw(){
    const rows = pkgFormulas().filter(matches);
    content.innerHTML = `
      <div class="section-head">
        <div><h1>Packaging Formula Master</h1><p>How packaging items chain together — e.g. sachets pack into a carton, cartons pack into a container. A base item can have several valid formulas (different ways it can be packed); each gets its own short label, selectable in Production Entry.</p></div>
        <button class="btn btn-primary" id="add-pf">${icon('plus')} Add Formula</button>
      </div>
      <div class="filter-bar no-print">
        <div class="filter-field"><label>Base Item</label><select class="input" id="pff-base">${selectOptions(filters.baseItemId, d.packagingMaterials.map(m=>({value:m.id,label:pkgFullLabel(m.id)})))}</select></div>
        <div class="filter-field"><label>Parent Item</label><select class="input" id="pff-parent">${selectOptions(filters.parentItemId, d.packagingMaterials.map(m=>({value:m.id,label:pkgFullLabel(m.id)})))}</select></div>
        <div class="filter-actions"><span class="filter-count">${rows.length} of ${pkgFormulas().length} formulas</span><button class="btn btn-outline btn-sm" id="pff-clear">Clear Filters</button></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Label</th><th>Base Item (smallest unit)</th><th>Parent Item (packs into)</th><th>Qty per Parent</th><th>Full Chain (resolved)</th><th></th></tr></thead>
          <tbody>
            ${rows.map(f=>{
              const chain = resolveChainFromFormula(f.id);
              const chainLabel = [pkgName(chain[0].parentItemId), ...chain.map(c=>pkgName(c.baseItemId))].join(' &rarr; ');
              return `<tr>
                <td><strong>${f.label}</strong></td>
                <td>${pkgFullLabel(f.baseItemId)}</td>
                <td>${pkgFullLabel(f.parentItemId)}</td>
                <td>${fmtNum(f.qtyPerParent,0)}</td>
                <td style="font-size:12px;color:hsl(var(--muted-foreground));">${chainLabel}${chain.length>1?' <span class="badge badge-blue" style="margin-left:4px;">'+ (chain.length+1) +'-level chain</span>':''}</td>
                <td style="display:flex;gap:4px;"><button class="icon-btn" data-edit-pf="${f.id}" title="Edit">${icon('edit')}</button><button class="icon-btn" data-del-pf="${f.id}" title="Delete">${icon('trash')}</button></td>
              </tr>`;
            }).join('') || `<tr><td colspan="6" class="empty-state">No packaging formulas match the current filters.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="note-banner" style="margin-top:16px;">${icon('info')}<div>A record's Base Item can itself be the Parent Item of another record — this is how multi-level chains like Sachet &rarr; Carton &rarr; Container are built. Each record is independently selectable in Production (e.g. you can pack only up to the Carton level, or go all the way to the Container level, using separate records/labels).</div></div>
    `;
    document.getElementById('pff-base').addEventListener('change', e=>{ filters.baseItemId=e.target.value; draw(); });
    document.getElementById('pff-parent').addEventListener('change', e=>{ filters.parentItemId=e.target.value; draw(); });
    document.getElementById('pff-clear').addEventListener('click', ()=>{ filters.baseItemId=''; filters.parentItemId=''; draw(); });
    document.getElementById('add-pf').addEventListener('click', ()=> openPkgFormulaModal(null));
    content.querySelectorAll('[data-edit-pf]').forEach(b=>b.addEventListener('click', ()=> openPkgFormulaModal(b.getAttribute('data-edit-pf'))));
    content.querySelectorAll('[data-del-pf]').forEach(b=>b.addEventListener('click', ()=>{
      const fid = b.getAttribute('data-del-pf');
      d.packagingFormulas = d.packagingFormulas.filter(f=>f.id!==fid);
      toast('Formula deleted'); draw();
    }));
  }
  function openPkgFormulaModal(existingId){
    const ex = existingId ? pkgFormulas().find(f=>f.id===existingId) : null;
    openModal(`
      <div class="modal-head"><h3>${ex?'Edit Packaging Formula':'Add Packaging Formula'}</h3><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
      <div class="modal-body">
        <div class="field"><label class="field-label">Label<span class="req">*</span></label><input class="input" id="pf-label" placeholder="e.g. 25kg Bag via 1kg Inner" value="${ex?escapeHtml(ex.label):''}" /></div>
        <div class="field-row" style="grid-template-columns:1fr 1fr;">
          <div class="field"><label class="field-label">Base Item (smallest unit)<span class="req">*</span></label><select class="input" id="pf-base">${d.packagingMaterials.map(m=>`<option value="${m.id}" ${ex&&ex.baseItemId===m.id?'selected':''}>${pkgFullLabel(m.id)}</option>`).join('')}</select></div>
          <div class="field"><label class="field-label">Parent Item (packs into)<span class="req">*</span></label><select class="input" id="pf-parent">${d.packagingMaterials.map(m=>`<option value="${m.id}" ${ex&&ex.parentItemId===m.id?'selected':''}>${pkgFullLabel(m.id)}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label class="field-label">Quantity per Parent<span class="req">*</span></label><input class="input" type="number" min="1" step="1" id="pf-qty" placeholder="e.g. 1000" value="${ex?ex.qtyPerParent:''}" /></div>
        <div id="pf-err"></div>
        <div class="field-hint">If the Base Item is itself the Parent of another formula record, the two automatically chain together (e.g. a Sachet &rarr; Carton record plus a Carton &rarr; Container record resolves into one 3-level chain).</div>
      </div>
      <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="save-pf">${ex?'Save Changes':'Save Formula'}</button></div>
    `);
    document.getElementById('save-pf').addEventListener('click', ()=>{
      const label = document.getElementById('pf-label').value.trim();
      const baseItemId = document.getElementById('pf-base').value;
      const parentItemId = document.getElementById('pf-parent').value;
      const qtyPerParent = parseFloat(document.getElementById('pf-qty').value)||0;
      const errEl = document.getElementById('pf-err');
      const showErr = m => errEl.innerHTML = m? `<div class="field-error" style="margin:-8px 0 8px;">${escapeHtml(m)}</div>` : '';
      if(!label){ showErr('Label is required'); return; }
      if(baseItemId===parentItemId){ showErr('Base Item and Parent Item cannot be the same'); return; }
      if(qtyPerParent<=0){ showErr('Quantity per Parent must be greater than zero'); return; }
      // guard against circular chains (A feeds B feeds A)
      const wouldCreate = {id:ex?ex.id:'tmp', label, baseItemId, parentItemId, qtyPerParent};
      const others = pkgFormulas().filter(f=>f.id!==wouldCreate.id).concat([wouldCreate]);
      const seen = new Set(); let cur = others.find(f=>f.id===wouldCreate.id); let circular=false;
      while(cur){ if(seen.has(cur.id)){ circular=true; break;} seen.add(cur.id); cur = others.find(f=>f.parentItemId===cur.baseItemId); }
      if(circular){ showErr('This would create a circular chain (an item ultimately packing into itself)'); return; }
      if(ex){ Object.assign(ex, {label, baseItemId, parentItemId, qtyPerParent}); closeModal(); toast('Formula updated'); draw(); return; }
      d.formulaCounterPkg = (d.formulaCounterPkg||0)+1;
      d.packagingFormulas.push({id:'PF-'+pad(d.formulaCounterPkg,4), label, baseItemId, parentItemId, qtyPerParent});
      closeModal(); toast('Formula added'); draw();
    });
  }
  draw();
}

          <div class="field"><label class="field-label">Category</label><input class="input" id="f-cat" value="Pigment Blend" /></div>

        </div>
        <div class="note-banner" style="margin:0;">${icon('info')}<div>Add the formula(s) for this grade from the Lot-based BOM / Formula screen after saving.</div></div>
      </div>
      <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="save-prod">Save Product</button></div>

        </div>
