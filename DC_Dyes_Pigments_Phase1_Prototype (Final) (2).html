      <div style="margin-top:18px;display:flex;justify-content:flex-end;">
        <button class="btn btn-primary" id="w-next">Continue</button>
      </div>
    `;
    document.getElementById('w-product').addEventListener('change', e=>{
      w.productId=e.target.value;
      const def = getDefaultFormula(w.productId);
      w.formulaId = def? def.id : null;
      drawWizard();
    });
    if(formulasForProduct.length>1){
      document.getElementById('w-formula').addEventListener('change', e=>{ w.formulaId=e.target.value; });
    }
    document.getElementById('w-next').addEventListener('click', ()=>{ if(!w.productId){toast('Select a product','error');return;} w.step=1; drawWizard(); });
  }
  else if(w.step===1){
    body.innerHTML = `
      <h3 style="margin-top:0;">Step 2 — Enter Number of Lots</h3>
      <div class="field" style="max-width:260px;">
        <label class="field-label">Number of Lots</label>
        <input class="input" type="number" min="1" id="w-lots" value="${w.lots}" />
      </div>
      <div class="kv"><span class="k">Standard Lot Qty</span><span class="v">${fmtNum(product.lotQty,1)} ${product.unit}</span></div>
      <div class="kv"><span class="k">Expected Total Output (pre-loss)</span><span class="v" id="w-expected">${fmtNum(product.lotQty*w.lots,1)} ${product.unit}</span></div>
      <div style="margin-top:18px;display:flex;justify-content:space-between;">
        <button class="btn btn-outline" id="w-back">Back</button>
        <button class="btn btn-primary" id="w-next">Load Formula &amp; Continue</button>
      </div>
    `;
    document.getElementById('w-lots').addEventListener('input', e=>{
      w.lots = parseFloat(e.target.value)||0;
      document.getElementById('w-expected').textContent = fmtNum(product.lotQty*w.lots,1)+' '+product.unit;
    });
    document.getElementById('w-back').addEventListener('click', ()=>{ w.step=0; drawWizard(); });
    document.getElementById('w-next').addEventListener('click', ()=>{ if(!w.lots||w.lots<=0){toast('Enter number of lots','error');return;} w.step=2; drawWizard(); });
  }
  else if(w.step===2){
    body.innerHTML = `
      <h3 style="margin-top:0;">Step 3 — Required Raw Materials (formula × lots, plus any add-on materials)</h3>
      <div class="table-wrap" style="border:1px solid hsl(var(--border));margin-bottom:6px;">
        <table>
          <thead><tr><th>Source</th><th>Material</th><th>Per Lot</th><th>Required (${fmtInt(w.lots)} lots)</th><th>Available Stock</th><th>Status</th></tr></thead>
          <tbody>
            ${req.map((r,idx)=>`
              <tr>
                <td>${r.source==='addon'? '<span class="badge badge-blue">Add-on</span>' : '<span class="badge badge-gray">Formula</span>'}</td>
                <td>${matName(r.matId)}</td>
                <td>${fmtNum(r.perLotQty, r.perLotUnit==='g'?0:2)} ${r.perLotUnit}</td>
                <td><strong>${fmtNum(r.totalQty,2)} kg</strong></td>
                <td>${fmtNum(r.available,1)} kg</td>
                <td>${r.short? '<span class="badge badge-red">Insufficient</span>' : '<span class="badge badge-green">Available</span>'}</td>
              </tr>
            `).join('') || `<tr><td colspan="6" class="empty-state">No formula defined for this grade. Set it up in Lot-based BOM / Formula first.</td></tr>`}
          </tbody>
        </table>
      </div>

      <div style="margin:16px 0;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <strong style="font-size:13px;">Add-on Materials <span style="font-weight:400;color:hsl(var(--muted-foreground));">(e.g. water, methanol — picked from the Raw Material master, entered per lot)</span></strong>
          <button class="btn btn-outline btn-sm" id="w-addon-add">${icon('plus')} Add-on Material</button>
        </div>
        <div id="w-addon-rows"></div>
        ${w.addOns.length===0? `<div style="font-size:12.5px;color:hsl(var(--muted-foreground));">No add-on materials for this run.</div>` : ''}
      </div>

      <div class="kv" style="max-width:420px;"><span class="k">Total Weight (formula + add-ons, ${fmtInt(w.lots)} lots)</span><span class="v">${fmtNum(totalWeightKg,2)} kg</span></div>

      ${anyShort? `
      <div class="note-banner" style="border-color:hsl(var(--destructive)/.3);background:hsl(var(--destructive)/.06);align-items:center;margin-top:14px;">
        ${icon('alert')}
        <div style="flex:1;">Stock is insufficient for one or more materials. Post a Raw Material Inward to top up stock, then come back here — this production entry will still be waiting for you.</div>
        <button class="btn btn-danger btn-sm" id="w-goto-inward" style="white-space:nowrap;">${icon('inward')} Go to Raw Material Inward</button>
      </div>` : ''}
      <div style="margin-top:12px;display:flex;justify-content:space-between;">
        <button class="btn btn-outline" id="w-back">Back</button>
        <button class="btn btn-primary" id="w-next" ${req.length===0?'disabled':''}>Consume from Inventory &amp; Calculate Cost</button>
      </div>
    `;
    function drawAddonRows(){
      const rowsEl = document.getElementById('w-addon-rows');
      rowsEl.innerHTML = w.addOns.map((a,idx)=>{
        const avail = a.matId ? rmStock(a.matId) : 0;
        const totalQty = a.matId ? toKg(a.qty,a.unit)*w.lots : 0;
        return `<div style="display:grid;grid-template-columns:2fr 1fr 90px 120px 34px;gap:8px;margin-bottom:8px;align-items:center;" data-arow="${idx}">
          <select class="input addon-mat">${d.rawMaterials.map(m=>`<option value="${m.id}" ${m.id===a.matId?'selected':''}>${m.name} (${m.shortCode}-${m.grade})</option>`).join('')}</select>
          <input class="input addon-qty" type="number" min="0" step="0.01" value="${a.qty}" placeholder="per lot" />
          <select class="input addon-unit"><option value="kg" ${a.unit==='kg'?'selected':''}>kg</option><option value="g" ${a.unit==='g'?'selected':''}>g</option></select>
          <div style="font-size:11.5px;color:hsl(var(--muted-foreground));">${fmtNum(totalQty,2)} kg total · ${fmtNum(avail,1)} kg avail.</div>
          <button class="icon-btn addon-del">${icon('trash')}</button>
        </div>`;
      }).join('');
      rowsEl.querySelectorAll('.addon-mat').forEach((el,idx)=>el.addEventListener('change', e=>{ w.addOns[idx].matId=e.target.value; drawWizard(); }));
      rowsEl.querySelectorAll('.addon-qty').forEach((el,idx)=>el.addEventListener('input', e=>{ w.addOns[idx].qty=parseFloat(e.target.value)||0; drawWizard(); }));
      rowsEl.querySelectorAll('.addon-unit').forEach((el,idx)=>el.addEventListener('change', e=>{ w.addOns[idx].unit=e.target.value; drawWizard(); }));
      rowsEl.querySelectorAll('.addon-del').forEach((el,idx)=>el.addEventListener('click', ()=>{ w.addOns.splice(idx,1); drawWizard(); }));
    }
    drawAddonRows();
    document.getElementById('w-addon-add').addEventListener('click', ()=>{
      if(d.rawMaterials.length===0){ toast('Add a raw material to the RM master first','error'); return; }
      w.addOns.push({matId:d.rawMaterials[0].id, qty:0, unit:'kg'});
      drawWizard();
    });
    document.getElementById('w-back').addEventListener('click', ()=>{ w.step=1; drawWizard(); });
    document.getElementById('w-next').addEventListener('click', ()=>{ w.step=3; drawWizard(); });
    if(anyShort){
      document.getElementById('w-goto-inward').addEventListener('click', ()=>{
        STATE.pendingInwardHint = firstShort.matId; // wizard state (STATE.wizard) is preserved so the user can resume
        navigate('rminward');
      });
    }
  }
  else if(w.step===3){
    body.innerHTML = `
      <h3 style="margin-top:0;">Step 4 — Material Consumption &amp; Costing</h3>
      <p style="color:hsl(var(--muted-foreground));font-size:13px;margin-top:-8px;">Materials will be consumed from available batches (oldest-first / FIFO) at the time of posting.</p>
      <div class="table-wrap" style="border:1px solid hsl(var(--border));">
        <table>
          <thead><tr><th>Material</th><th>Qty to Consume</th><th>Weighted Avg Rate</th><th>Material Cost</th></tr></thead>
          <tbody>
            ${req.map(r=>`
              <tr>
                <td>${matName(r.matId)}</td>
                <td>${fmtNum(r.totalQty,2)} kg</td>
                <td>${money(rmAvgRate(r.matId))}</td>
                <td>${money(r.totalQty*rmAvgRate(r.matId))}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div style="text-align:right;margin-top:10px;font-size:14px;"><strong>Total Raw Material Cost: ${money(rmCost)}</strong></div>
      <div class="kv" style="max-width:420px;margin-left:auto;border-top:1px solid hsl(var(--border));padding-top:10px;margin-top:6px;">
        <span class="k">Rate per Kilo (Total price &divide; Total weight)</span><span class="v">${money(totalWeightKg? rmCost/totalWeightKg : 0)}</span>
      </div>
      <div class="note-banner" style="margin-top:10px;">${icon('info')}<div>This is an early indicator based on total material weight going in (${fmtNum(totalWeightKg,2)} kg, including add-ons). The Finished Product cost/kg used for Sales is recalculated after Actual Output is entered, since it also accounts for reconciliation loss and packaging cost.</div></div>

      <h4 style="margin:22px 0 4px;font-size:13.5px;">Estimated Packaging Material</h4>
      <p style="color:hsl(var(--muted-foreground));font-size:12.5px;margin:0 0 10px;">Planning estimate for <strong>${product? product.grade+' — '+product.name : '—'}</strong> at a total production weight of <strong>${fmtNum(totalWeightKg,2)} kg</strong>. Pick a packing configuration (from Packaging Formula Master) — the estimate rolls up through every level that configuration consumes, e.g. inner packets AND the outer bag. Base-unit requirement = total weight &divide; base unit's pack capacity, rounded up. This is for planning only — it does not change the costing, totals or rate per kilo above.</p>
      <div id="w-pkgest"></div>
      <button class="btn btn-outline btn-sm" id="w-pkgest-add" style="margin-top:8px;">${icon('plus')} Add Packaging Line</button>

      <h4 style="margin:22px 0 8px;font-size:13.5px;">Packaging Consumed (optional)</h4>
      <div id="w-pkg-lines"></div>
      <button class="btn btn-outline btn-sm" id="w-pkg-add">${icon('plus')} Add Packaging Line</button>

      <div style="margin-top:20px;display:flex;justify-content:space-between;">
        <button class="btn btn-outline" id="w-back">Back</button>
        <button class="btn btn-primary" id="w-next">Continue to Actual Output</button>
      </div>
    `;
    function drawPkgLines(){
      document.getElementById('w-pkg-lines').innerHTML = w.packagingLines.length===0? `<div style="font-size:12.5px;color:hsl(var(--muted-foreground));margin-bottom:8px;">No packaging lines added.</div>` :
      w.packagingLines.map((l,idx)=>{
        const pm = d.packagingMaterials.find(m=>m.id===l.matId);
        const stockConsumed = l.usageQty*pm.convQtyPerUsage;
        return `<div style="display:grid;grid-template-columns:2fr 1fr 1fr 34px;gap:8px;margin-bottom:8px;align-items:center;" data-pl="${idx}">
          <select class="input pl-mat">${d.packagingMaterials.map(m=>`<option value="${m.id}" ${m.id===l.matId?'selected':''}>${m.name} — ${m.size} — ${m.brand}</option>`).join('')}</select>
          <input class="input pl-qty" type="number" min="0" value="${l.usageQty}" placeholder="Qty (${pm.usageUnit})" />
          <div style="font-size:12px;color:hsl(var(--muted-foreground));">${fmtNum(stockConsumed,2)} ${pm.unit} stock · ${money(stockConsumed*pkgAvgRate(pm.id))}</div>
          <button class="icon-btn pl-del">${icon('trash')}</button>
        </div>`;
      }).join('');
      document.querySelectorAll('.pl-mat').forEach((el,idx)=>el.addEventListener('change', e=>{ w.packagingLines[idx].matId=e.target.value; drawPkgLines(); }));
      document.querySelectorAll('.pl-qty').forEach((el,idx)=>el.addEventListener('input', e=>{ w.packagingLines[idx].usageQty=parseFloat(e.target.value)||0; drawPkgLines(); }));
      document.querySelectorAll('.pl-del').forEach((el,idx)=>el.addEventListener('click', ()=>{ w.packagingLines.splice(idx,1); drawPkgLines(); }));
    }
    /* ---- Estimated Packaging Material (planning only, multilevel via Packaging Formula Master) ---- */
    const uniq = arr => [...new Set(arr)];
    function validOuterIds(){ return uniq(buildPackagingConfigurations(w.productId).map(c=>c.outerItemId)); }
    function itemNamesAvailable(){ return uniq(validOuterIds().map(id=>d.packagingMaterials.find(m=>m.id===id).name)); }
    function sizesFor(name){ return uniq(validOuterIds().map(id=>d.packagingMaterials.find(m=>m.id===id)).filter(m=>m.name===name).map(m=>m.size)); }
    function brandsFor(name,size){ return uniq(validOuterIds().map(id=>d.packagingMaterials.find(m=>m.id===id)).filter(m=>m.name===name && m.size===size).map(m=>m.brand)); }
    function skuFor(l){ return d.packagingMaterials.find(m=>validOuterIds().includes(m.id) && m.name===l.itemName && m.size===l.size && m.brand===l.brand) || null; }
    function configsForSku(skuId){ return buildPackagingConfigurations(w.productId).filter(c=>c.outerItemId===skuId); }
    function defaultLine(){
      const names = itemNamesAvailable();
      if(names.length===0) return null;
      const itemName = names[0], size = sizesFor(itemName)[0], brand = brandsFor(itemName,size)[0];
      const sku = d.packagingMaterials.find(m=>validOuterIds().includes(m.id) && m.name===itemName && m.size===size && m.brand===brand);
      const configs = configsForSku(sku.id);
      return {itemName, size, brand, configId: configs[0]? configs[0].id : null, overrides:{}};
    }
    if(!w.pkgEst || w.pkgEst.productId!==w.productId){
      const dl = defaultLine();
      w.pkgEst = {productId:w.productId, lines: dl? [dl] : []};
    }
    function levelsForLine(l){
      const sku = skuFor(l); if(!sku) return null;
      const config = buildPackagingConfigurations(w.productId).find(c=>c.id===l.configId) || configsForSku(sku.id)[0];
      if(!config) return null;
      return {config, levels: resolveConfigLevels(config)};
    }
    function autoQtyAtLevel(levels, idx){
      const innermost = levels[levels.length-1];
      const baseItem = d.packagingMaterials.find(m=>m.id===innermost.itemId);
      if(!baseItem || !(baseItem.packCapacity>0)) return 0;
      const baseUnitsNeeded = Math.ceil(totalWeightKg/baseItem.packCapacity - 1e-9);
      return Math.max(0, Math.ceil(baseUnitsNeeded * levels[idx].cumUnitsPerOuter / innermost.cumUnitsPerOuter - 1e-9));
    }
    function shownQtyAtLevel(l, levels, idx){
      const ov = l.overrides[levels[idx].itemId];
      return (ov!==undefined && ov!==null) ? ov : autoQtyAtLevel(levels, idx);
    }
    function availCellFor(itemId, qty){
      const s = d.packagingMaterials.find(m=>m.id===itemId); if(!s) return '—';
      const availUse = pkgStock(s.id)/(s.convQtyPerUsage||1);
      const short = qty>availUse+1e-9;
      return `<strong>${fmtNum(availUse,0)} ${s.usageUnit}</strong>${s.unit!==s.usageUnit?`<div style="font-size:11px;color:hsl(var(--muted-foreground));">${fmtNum(pkgStock(s.id),1)} ${s.unit} in stock</div>`:''}${short?`<div style="font-size:11px;color:hsl(var(--destructive));font-weight:700;">Short by ${fmtNum(qty-availUse,0)}</div>`:''}`;
    }
    function drawPkgEst(){
      const lines = w.pkgEst.lines;
      const el = document.getElementById('w-pkgest');
      if(itemNamesAvailable().length===0){ el.innerHTML = `<div style="font-size:12.5px;color:hsl(var(--muted-foreground));">No packaging items/configurations are available for this product (check Packaging Master "Product Associated"/Universal, and Packaging Formula Master).</div>`; return; }
      if(lines.length===0){ el.innerHTML = `<div style="font-size:12.5px;color:hsl(var(--muted-foreground));margin-bottom:8px;">No packaging lines added.</div>`; return; }
      el.innerHTML = lines.map((l,i)=>{
        const resolved = levelsForLine(l);
        const configs = (()=>{ const s=skuFor(l); return s? configsForSku(s.id) : []; })();
        const header = `<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr ${configs.length>1?'1.6fr':''} 34px;gap:8px;align-items:center;margin-bottom:8px;">
            <select class="input pe-item" data-li="${i}">${itemNamesAvailable().map(n=>`<option ${n===l.itemName?'selected':''}>${n}</option>`).join('')}</select>
            <select class="input pe-size" data-li="${i}">${sizesFor(l.itemName).map(n=>`<option ${n===l.size?'selected':''}>${n}</option>`).join('')}</select>
            <select class="input pe-brand" data-li="${i}">${brandsFor(l.itemName,l.size).map(n=>`<option ${n===l.brand?'selected':''}>${n}</option>`).join('')}</select>
            ${configs.length>1? `<select class="input pe-config" data-li="${i}">${configs.map(c=>`<option value="${c.id}" ${c.id===l.configId?'selected':''}>${c.label}</option>`).join('')}</select>` : ''}
            <button class="icon-btn pe-del" data-li="${i}" title="Remove this packaging line">${icon('trash')}</button>
          </div>`;
        if(!resolved){
          return header + `<div class="note-banner" style="border-color:hsl(var(--destructive)/.3);background:hsl(var(--destructive)/.06);margin-bottom:16px;">${icon('alert')}<div>No packing configuration is defined for this item yet — add one in Packaging Formula Master, or this item has no Pack Capacity set.</div></div>`;
        }
        const {config, levels} = resolved;
        const levelRows = levels.map((lv,idx)=>{
          const item = d.packagingMaterials.find(m=>m.id===lv.itemId);
          const qty = shownQtyAtLevel(l, levels, idx);
          const hasOverride = l.overrides[lv.itemId]!==undefined && l.overrides[lv.itemId]!==null;
          return `<tr>
            <td>${idx===0? `<span class="badge badge-blue">Outer</span>` : (idx===levels.length-1? `<span class="badge badge-gray">Base unit</span>` : `<span class="badge badge-gray">Level ${idx+1}</span>`)}</td>
            <td>${item.name}</td><td>${item.size}</td><td>${item.brand}</td>
            <td>${item.packCapacity? fmtNum(item.packCapacity,2)+' kg' : (idx===levels.length-1? '<span style="color:hsl(var(--destructive));">not set</span>' : '<span style="color:hsl(var(--muted-foreground));">derived</span>')}</td>
            <td style="white-space:nowrap;"><input class="input pe-qty" data-li="${i}" data-item="${lv.itemId}" type="number" min="0" step="1" value="${qty}" style="width:90px;display:inline-block;" /> <span style="font-size:11.5px;color:hsl(var(--muted-foreground));">${item.usageUnit}</span>${hasOverride?` <button class="btn btn-ghost btn-sm pe-reset" data-li="${i}" data-item="${lv.itemId}" title="Back to auto estimate">&#8634; auto</button>`:''}</td>
            <td>${availCellFor(lv.itemId, qty)}</td>
          </tr>`;
        }).join('');
        return header + `<div class="table-wrap" style="border:1px solid hsl(var(--border));margin-bottom:18px;">
          <div class="card-pad-head" style="padding:10px 14px;"><strong style="font-size:12.5px;">${config.label}${levels.length>2?` — ${levels.length}-level chain`:''}</strong></div>
          <table><thead><tr><th>Level</th><th>Item</th><th>Size</th><th>Brand</th><th>Pack Capacity</th><th>Estimated Qty</th><th>Available Stock</th></tr></thead><tbody>${levelRows}</tbody></table>
        </div>`;
      }).join('');
      el.querySelectorAll('.pe-item').forEach(sel=>sel.addEventListener('change', e=>{
        const i=parseInt(e.target.getAttribute('data-li')); const l=lines[i];
        l.itemName=e.target.value; l.size=sizesFor(l.itemName)[0]; l.brand=brandsFor(l.itemName,l.size)[0];
        const s=skuFor(l); const cfgs=s?configsForSku(s.id):[]; l.configId=cfgs[0]?cfgs[0].id:null; l.overrides={};
        drawPkgEst();
      }));
      el.querySelectorAll('.pe-size').forEach(sel=>sel.addEventListener('change', e=>{
        const i=parseInt(e.target.getAttribute('data-li')); const l=lines[i];
        l.size=e.target.value; l.brand=brandsFor(l.itemName,l.size)[0];
        const s=skuFor(l); const cfgs=s?configsForSku(s.id):[]; l.configId=cfgs[0]?cfgs[0].id:null; l.overrides={};
        drawPkgEst();
      }));
      el.querySelectorAll('.pe-brand').forEach(sel=>sel.addEventListener('change', e=>{
        const i=parseInt(e.target.getAttribute('data-li')); const l=lines[i];
        l.brand=e.target.value;
        const s=skuFor(l); const cfgs=s?configsForSku(s.id):[]; l.configId=cfgs[0]?cfgs[0].id:null; l.overrides={};
        drawPkgEst();
      }));
      el.querySelectorAll('.pe-config').forEach(sel=>sel.addEventListener('change', e=>{
        const i=parseInt(e.target.getAttribute('data-li')); lines[i].configId=e.target.value; lines[i].overrides={}; drawPkgEst();
      }));
      el.querySelectorAll('.pe-qty').forEach(inp=>inp.addEventListener('input', e=>{
        const i=parseInt(e.target.getAttribute('data-li')); const itemId=e.target.getAttribute('data-item');
        lines[i].overrides[itemId] = Math.max(0, parseInt(e.target.value,10)||0);
        drawPkgEst();
      }));
      el.querySelectorAll('.pe-reset').forEach(btn=>btn.addEventListener('click', e=>{
        const i=parseInt(e.target.getAttribute('data-li')); const itemId=e.target.getAttribute('data-item');
        delete lines[i].overrides[itemId]; drawPkgEst();
      }));
      el.querySelectorAll('.pe-del').forEach(btn=>btn.addEventListener('click', e=>{
        const i=parseInt(e.target.getAttribute('data-li')); lines.splice(i,1); drawPkgEst();
      }));
    }
    drawPkgEst();
    document.getElementById('w-pkgest-add').addEventListener('click', ()=>{
      const dl = defaultLine();
      if(!dl){ toast('No packaging items/configurations are available for this product','error'); return; }
      w.pkgEst.lines.push(dl);
      drawPkgEst();
    });

    drawPkgLines();
    document.getElementById('w-pkg-add').addEventListener('click', ()=>{ w.packagingLines.push({matId:d.packagingMaterials[0].id, usageQty:0}); drawPkgLines(); });
    document.getElementById('w-back').addEventListener('click', ()=>{ w.step=2; drawWizard(); });
    document.getElementById('w-next').addEventListener('click', ()=>{ w.step=4; drawWizard(); });
  }
  else if(w.step===4){
    const expected = product.lotQty*w.lots;
    if(w.actualOutput===undefined) w.actualOutput = Math.round(expected*0.965*100)/100;
    body.innerHTML = `
      <h3 style="margin-top:0;">Step 5 — Actual Post-Production Output</h3>
      <div class="kv"><span class="k">Total Material Input (formula-based)</span><span class="v">${fmtNum(expected,2)} kg</span></div>
      <div class="field" style="max-width:280px;margin-top:14px;">
        <label class="field-label">Actual Output Weighed (kg)</label>
        <input class="input" type="number" step="0.01" id="w-actual" value="${w.actualOutput}" />
      </div>
      <div style="margin-top:18px;display:flex;justify-content:space-between;">
        <button class="btn btn-outline" id="w-back">Back</button>
        <button class="btn btn-primary" id="w-next">Reconcile</button>
      </div>
    `;
    document.getElementById('w-actual').addEventListener('input', e=>{ w.actualOutput=parseFloat(e.target.value)||0; });
    document.getElementById('w-back').addEventListener('click', ()=>{ w.step=3; drawWizard(); });
    document.getElementById('w-next').addEventListener('click', ()=>{ if(!w.actualOutput||w.actualOutput<=0){toast('Enter actual output','error');return;} w.step=5; drawWizard(); });
  }
  else if(w.step===5){
    const expected = product.lotQty*w.lots;
    const wastage = Math.max(0, expected - w.actualOutput);
    const wastagePct = expected? (wastage/expected*100) : 0;
    const pkgCost = w.packagingLines.reduce((s,l)=>{
      const pm = d.packagingMaterials.find(m=>m.id===l.matId);
      const stockConsumed = l.usageQty*pm.convQtyPerUsage;
      return s + stockConsumed*pkgAvgRate(pm.id);
    },0);
    const totalCost = rmCost + pkgCost;
    const costPerKg = w.actualOutput? totalCost/w.actualOutput : 0;
    body.innerHTML = `
      <h3 style="margin-top:0;">Step 6 — Reconciliation &amp; Finished Batch</h3>
      <div class="grid" style="grid-template-columns:1fr 1fr;">
        <div>
          <div class="kv"><span class="k">Total Material Input</span><span class="v">${fmtNum(expected,2)} kg</span></div>
          <div class="kv"><span class="k">Actual Output</span><span class="v">${fmtNum(w.actualOutput,2)} kg</span></div>
          <div class="kv"><span class="k">Evaporation / Wastage</span><span class="v">${fmtNum(wastage,2)} kg (${fmtNum(wastagePct,2)}%)</span></div>
        </div>
        <div>
          <div class="kv"><span class="k">Raw Material Cost</span><span class="v">${money(rmCost)}</span></div>
          <div class="kv"><span class="k">Packaging Cost</span><span class="v">${money(pkgCost)}</span></div>
          <div class="kv"><span class="k">Total Production Cost</span><span class="v">${money(totalCost)}</span></div>
          <div class="kv"><span class="k">Cost / kg of Finished Product</span><span class="v">${money(costPerKg)}</span></div>
        </div>
      </div>
      ${wastagePct>2.5? `<div class="note-banner" style="border-color:hsl(var(--warning)/.4);background:hsl(var(--warning)/.1);margin-top:14px;">${icon('alert')}<div>Wastage is above 2.5%. Final treatment of the loss rule (and any recoverable material) is one of the open points to confirm with the client before development freeze.</div></div>` : ''}
      <div style="margin-top:20px;display:flex;justify-content:space-between;">
        <button class="btn btn-outline" id="w-back">Back</button>
        <button class="btn btn-primary" id="w-finish">${icon('check')} Create Finished Product Batch</button>
      </div>
    `;
    document.getElementById('w-back').addEventListener('click', ()=>{ w.step=4; drawWizard(); });
    document.getElementById('w-finish').addEventListener('click', ()=>{
      postProduction(w, product, req, expected, wastage, rmCost, pkgCost, totalCost, costPerKg);
    });
  }
}
function postProduction(w, product, req, expected, wastage, rmCost, pkgCost, totalCost, costPerKg){
  const d = db();
  const date = todayStr();
  // consume RM batches FIFO by date
  req.forEach(r=>{
    let remaining = r.totalQty;
    const batches = d.rmBatches.filter(b=>b.matId===r.matId && b.qty>0.0001).sort((a,b)=>a.date.localeCompare(b.date));
    for(const b of batches){
      if(remaining<=0.0001) break;
      const take = Math.min(b.qty, remaining);
      b.qty -= take; remaining -= take;
      d.rmLedger.push({id:'LG-OUT-'+nextSeq(STATE.companyId+'-rmout'), date, type:'OUT', matId:r.matId, batchNo:b.batchNo, qty:take, rate:b.rate, value:take*b.rate, ref:'', note:'Production consumption'});
    }
  });
  // consume packaging
  w.packagingLines.forEach(l=>{
    const pm = d.packagingMaterials.find(m=>m.id===l.matId);
    let remaining = l.usageQty*pm.convQtyPerUsage;
    const batches = d.packagingBatches.filter(b=>b.matId===l.matId && b.qty>0.0001).sort((a,b)=>a.date.localeCompare(b.date));
    for(const b of batches){
      if(remaining<=0.0001) break;
      const take = Math.min(b.qty, remaining);
      b.qty -= take; remaining -= take;
      d.packagingLedger.push({id:'PLG-OUT-'+nextSeq(STATE.companyId+'-pkgout'), date, type:'OUT', matId:l.matId, batchNo:b.batchNo, qty:take, rate:b.rate, value:take*b.rate, ref:'', note:'Production consumption'});
    }
  });
  d.prodCounter++;
  const prodId = 'PRN-'+pad(d.prodCounter,4);
  // backfill ref on the OUT entries just created for this run
  d.rmLedger.filter(l=>l.type==='OUT' && l.ref==='' ).forEach(l=>{ l.ref=prodId; });
  d.packagingLedger.filter(l=>l.type==='OUT' && l.ref==='').forEach(l=>{ l.ref=prodId; });

  d.fgCounter++;
  const fgId = 'FG-'+product.grade+'-'+pad(d.fgCounter,4);
  d.finishedGoods.push({id:fgId, productId:product.id, date, qty:w.actualOutput, remainingQty:w.actualOutput, costPerKg, prodRef:prodId});
  d.productionBatches.push({
    id:prodId, date, productId:product.id, lots:w.lots, expectedOutput:expected, actualOutput:w.actualOutput,
    wastage, wastagePct: expected? (wastage/expected*100):0, rmCost, pkgCost, totalCost, costPerKg, fgId
  });

  toast(`${fgId} created — ${fmtNum(w.actualOutput,1)} kg posted to Finished Goods`);
  STATE.wizard = newWizard();
  navigate('finishedgoods');
}

        <div class="field-row" style="grid-template-columns:1fr 1fr;">

          <div class="field">
            <label class="field-label">Apply GST?</label>
            <div class="pill-toggle" id="se-gst-toggle">
              <button type="button" class="active" data-gst="no">No</button>
              <button type="button" data-gst="yes">Yes</button>
            </div>
          </div>
        </div>
        <div class="field" id="se-gstpct-field" style="display:none;max-width:220px;">
          <label class="field-label">GST %</label>
          <input class="input" type="number" min="0" step="0.01" id="se-gstpct" placeholder="e.g. 18" value="18" />
        </div>
        <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:12px;padding-top:14px;border-top:1px solid hsl(var(--border));">
          <div class="kv" style="border:none;"><span class="k">Sale Value&nbsp;</span><span class="v" id="se-saleval">₹0.00</span></div>
          <div class="kv" style="border:none;"><span class="k">GST Amount&nbsp;</span><span class="v" id="se-gstval">₹0.00</span></div>
          <div class="kv" style="border:none;"><span class="k">Total Invoice Value&nbsp;</span><span class="v" id="se-totalval">₹0.00</span></div>
        </div>
        <div class="kv" style="max-width:320px;"><span class="k">Estimated Profit / Loss</span><span class="v" id="se-pl">₹0.00</span></div>
        <div style="display:flex;justify-content:flex-end;margin-top:10px;">
          <button class="btn btn-primary" id="se-save" ${sellable.length===0||d.customers.length===0?'disabled':''}>${icon('check')} Record Sale</button>
        </div>
      </div>

      <div class="filter-bar no-print">
        <div class="filter-field"><label>Product</label><select class="input" id="hf-prod">${selectOptions(histFilters.productId, d.products.map(p=>({value:p.id,label:p.grade+' — '+p.name})))}</select></div>
        <div class="filter-field"><label>Customer</label><select class="input" id="hf-cust">${selectOptions(histFilters.customerId, d.customers.map(c=>({value:c.id,label:c.name})))}</select></div>
        <div class="filter-field"><label>GST</label><select class="input" id="hf-gst"><option value="">All</option><option value="yes" ${histFilters.gst==='yes'?'selected':''}>Applied</option><option value="no" ${histFilters.gst==='no'?'selected':''}>Not Applied</option></select></div>
        <div class="filter-field"><label>From Date</label><input class="input" type="date" id="hf-from" value="${histFilters.from}" /></div>
        <div class="filter-field"><label>To Date</label><input class="input" type="date" id="hf-to" value="${histFilters.to}" /></div>
        <div class="filter-actions"><span class="filter-count" id="hf-count"></span><button class="btn btn-outline btn-sm" id="hf-clear">Clear Filters</button></div>
      </div>
      <div class="table-wrap">
        <div class="card-pad-head"><strong style="font-size:13px;">Sales transactions</strong></div>
        <table>
          <thead><tr><th>Date</th><th>Invoice</th><th>Batch</th><th>Product</th><th>Customer</th><th>Qty</th><th>Cost Rate</th><th>Sale Rate</th><th>Sale Value</th><th>GST</th><th>Total</th><th>P/L</th></tr></thead>
          <tbody id="hf-tbody"></tbody>
        </table>
      </div>
    `;

    if(sellable.length===0){
      document.getElementById('se-cost').value = '—';
    }
    function selectedBatch(){ return d.finishedGoods.find(b=>b.id===document.getElementById('se-batch').value); }
    function refreshCostAndCalc(){
      const b = selectedBatch();
      document.getElementById('se-cost').value = b? money(b.costPerKg) : '—';
      recalcTotals();
    }
    function gstApplied(){ return document.querySelector('#se-gst-toggle button.active').getAttribute('data-gst')==='yes'; }
    function recalcTotals(){
      const b = selectedBatch();
      const qty = parseFloat(document.getElementById('se-qty').value)||0;
      const rate = parseFloat(document.getElementById('se-rate').value)||0;
      const costRate = b? b.costPerKg : 0;
      const saleValue = qty*rate;
      const applied = gstApplied();
      const gstPct = applied ? (parseFloat(document.getElementById('se-gstpct').value)||0) : 0;
      const gstAmt = applied ? saleValue*gstPct/100 : 0;
      const total = saleValue+gstAmt;
      const pl = (rate-costRate)*qty;
      document.getElementById('se-saleval').textContent = money(saleValue);
      document.getElementById('se-gstval').textContent = money(gstAmt);
      document.getElementById('se-totalval').textContent = money(total);
      const plEl = document.getElementById('se-pl');
      plEl.textContent = money(pl);
      plEl.style.color = pl>=0? 'hsl(var(--success))' : 'hsl(var(--destructive))';
    }
    if(sellable.length>0){
      document.getElementById('se-batch').addEventListener('change', refreshCostAndCalc);
      refreshCostAndCalc();
    }
    document.getElementById('se-qty').addEventListener('input', recalcTotals);
    document.getElementById('se-rate').addEventListener('input', recalcTotals);
    document.getElementById('se-gstpct').addEventListener('input', recalcTotals);
    document.querySelectorAll('#se-gst-toggle button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#se-gst-toggle button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('se-gstpct-field').style.display = btn.getAttribute('data-gst')==='yes' ? 'block' : 'none';
        recalcTotals();
      });
    });
    recalcTotals();

    document.getElementById('se-save').addEventListener('click', ()=>{
      const b = selectedBatch();
      if(!b){ toast('No finished goods batch available to sell','error'); return; }
      const custId = document.getElementById('se-cust').value;
      if(!custId){ toast('Select a customer','error'); return; }
      const qty = parseFloat(document.getElementById('se-qty').value)||0;
      if(qty<=0){ toast('Enter a quantity sold greater than zero','error'); return; }
      if(qty > b.remainingQty + 0.0001){ toast(`Only ${fmtNum(b.remainingQty,1)} kg is available on this batch`,'error'); return; }
      const rate = parseFloat(document.getElementById('se-rate').value)||0;
      if(rate<=0){ toast('Enter the actual sale rate','error'); return; }
      const applied = gstApplied();
      const gstPct = applied ? (parseFloat(document.getElementById('se-gstpct').value)||0) : 0;
      const saleValue = qty*rate;
      const gstAmount = applied ? saleValue*gstPct/100 : 0;
      const totalValue = saleValue+gstAmount;
      const costRate = b.costPerKg;
      const profitLoss = (rate-costRate)*qty;
      const date = document.getElementById('se-date').value || todayStr();
      const invoiceRef = document.getElementById('se-invoice').value.trim() || ('INV-'+pad(d.salesCounter+1,4));

      d.salesCounter++;
      const saleId = 'SALE-'+pad(d.salesCounter,4);
      d.sales.push({
        id:saleId, date, fgId:b.id, productId:b.productId, customerId:custId, invoiceRef,
        qty, costRate, saleRate:rate, gstApplied:applied, gstPct, saleValue, gstAmount, totalValue, profitLoss
      });
      b.remainingQty -= qty;

      toast(`${saleId} recorded — ${fmtNum(qty,1)} kg sold to ${custName(custId)}`);
      renderSalesEntry();
    });

    function renderHistory(){
      const all = [...d.sales].sort((a,b)=>b.date.localeCompare(a.date));
      const rows = all.filter(s=>{
        if(histFilters.productId && s.productId!==histFilters.productId) return false;
        if(histFilters.customerId && s.customerId!==histFilters.customerId) return false;
        if(histFilters.gst==='yes' && !s.gstApplied) return false;
        if(histFilters.gst==='no' && s.gstApplied) return false;
        if(histFilters.from && s.date < histFilters.from) return false;
        if(histFilters.to && s.date > histFilters.to) return false;
        return true;
      });
      document.getElementById('hf-tbody').innerHTML = rows.map(s=>`
        <tr>
          <td>${fmtDate(s.date)}</td>
          <td>${s.invoiceRef}</td>
          <td><span class="badge badge-blue">${s.fgId}</span></td>
          <td>${prodName(s.productId)}</td>
          <td>${custName(s.customerId)}</td>
          <td>${fmtNum(s.qty,1)} kg</td>
          <td>${money(s.costRate)}</td>
          <td>${money(s.saleRate)}</td>
          <td>${money(s.saleValue)}</td>
          <td>${s.gstApplied? `${money(s.gstAmount)} (${fmtNum(s.gstPct,1)}%)` : '<span class="badge badge-gray">Not Applied</span>'}</td>
          <td><strong>${money(s.totalValue)}</strong></td>
          <td style="color:${s.profitLoss>=0?'hsl(var(--success))':'hsl(var(--destructive))'};font-weight:700;">${money(s.profitLoss)}</td>
        </tr>
      `).join('') || `<tr><td colspan="12" class="empty-state">No sales match the current filters.</td></tr>`;
      document.getElementById('hf-count').textContent = `${rows.length} of ${all.length} sales`;
    }
    document.getElementById('hf-prod').addEventListener('change', e=>{ histFilters.productId=e.target.value; renderHistory(); });
    document.getElementById('hf-cust').addEventListener('change', e=>{ histFilters.customerId=e.target.value; renderHistory(); });
    document.getElementById('hf-gst').addEventListener('change', e=>{ histFilters.gst=e.target.value; renderHistory(); });
    document.getElementById('hf-from').addEventListener('change', e=>{ histFilters.from=e.target.value; renderHistory(); });
    document.getElementById('hf-to').addEventListener('change', e=>{ histFilters.to=e.target.value; renderHistory(); });
    document.getElementById('hf-clear').addEventListener('click', ()=>{ histFilters.productId=''; histFilters.customerId=''; histFilters.gst=''; histFilters.from=''; histFilters.to=''; renderHistory(); });
    renderHistory();
  }
  draw();
}

/* ---- 1.5 Sales Report ---- */
function renderSalesReport(){
  const d = db();
  let tab = 'product';
  const filters = {productId:'', customerId:'', from:'', to:'', gst:''};
  const content = document.getElementById('content');

  function filteredSales(){
    return d.sales.filter(s=>{
      if(filters.productId && s.productId!==filters.productId) return false;
      if(filters.customerId && s.customerId!==filters.customerId) return false;
      if(filters.gst==='yes' && !s.gstApplied) return false;
      if(filters.gst==='no' && s.gstApplied) return false;
      if(filters.from && s.date < filters.from) return false;
      if(filters.to && s.date > filters.to) return false;
      return true;
    });
  }
  function draw(){
    content.innerHTML = `
      <div class="section-head">
        <div><h1>Sales Report</h1><p>Product-wise, customer-wise and date-wise rollups of sales, cost, GST and profit/loss.</p></div>
      </div>
      <div class="filter-bar no-print">
        <div class="filter-field"><label>Product</label><select class="input" id="sr-prod">${selectOptions(filters.productId, d.products.map(p=>({value:p.id,label:p.grade+' — '+p.name})))}</select></div>
        <div class="filter-field"><label>Customer</label><select class="input" id="sr-cust">${selectOptions(filters.customerId, d.customers.map(c=>({value:c.id,label:c.name})))}</select></div>
        <div class="filter-field"><label>GST</label><select class="input" id="sr-gst"><option value="">All</option><option value="yes" ${filters.gst==='yes'?'selected':''}>Applied</option><option value="no" ${filters.gst==='no'?'selected':''}>Not Applied</option></select></div>
        <div class="filter-field"><label>From Date</label><input class="input" type="date" id="sr-from" value="${filters.from}" /></div>
        <div class="filter-field"><label>To Date</label><input class="input" type="date" id="sr-to" value="${filters.to}" /></div>
        <div class="filter-actions"><button class="btn btn-outline btn-sm" id="sr-clear">Clear Filters</button></div>
      </div>
      <div class="tabs no-print">
        <button class="tab-btn ${tab==='product'?'active':''}" data-tab="product">Product-wise</button>
        <button class="tab-btn ${tab==='customer'?'active':''}" data-tab="customer">Customer-wise</button>
        <button class="tab-btn ${tab==='date'?'active':''}" data-tab="date">Date-wise</button>
      </div>
      <div id="sr-body"></div>
    `;
    document.getElementById('sr-prod').addEventListener('change', e=>{ filters.productId=e.target.value; drawTable(); });
    document.getElementById('sr-cust').addEventListener('change', e=>{ filters.customerId=e.target.value; drawTable(); });
    document.getElementById('sr-gst').addEventListener('change', e=>{ filters.gst=e.target.value; drawTable(); });
    document.getElementById('sr-from').addEventListener('change', e=>{ filters.from=e.target.value; drawTable(); });
    document.getElementById('sr-to').addEventListener('change', e=>{ filters.to=e.target.value; drawTable(); });
    document.getElementById('sr-clear').addEventListener('click', ()=>{ filters.productId=''; filters.customerId=''; filters.gst=''; filters.from=''; filters.to=''; draw(); });
    content.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>{ tab=b.getAttribute('data-tab'); drawTable(); }));
    drawTable();
  }
  function aggregate(keyFn, labelFn){
    const groups = {};
    filteredSales().forEach(s=>{
      const key = keyFn(s);
      if(!groups[key]) groups[key] = {label:labelFn(s), qty:0, costValue:0, saleValueExGst:0, gstValue:0, totalValue:0, pl:0};
      const g = groups[key];
      g.qty += s.qty;
      g.costValue += s.costRate*s.qty;
      g.saleValueExGst += s.saleValue;
      g.gstValue += s.gstAmount;
      g.totalValue += s.totalValue;
      g.pl += s.profitLoss;
    });
    return Object.values(groups).sort((a,b)=>b.totalValue-a.totalValue);
  }
  function drawTable(){
    const body = document.getElementById('sr-body');
    let rows, title, exportName;
    if(tab==='product'){ rows = aggregate(s=>s.productId, s=>prodName(s.productId)); title='Product'; exportName='Sales_Report_Product'; }
    else if(tab==='customer'){ rows = aggregate(s=>s.customerId, s=>custName(s.customerId)); title='Customer'; exportName='Sales_Report_Customer'; }
    else { rows = aggregate(s=>s.date, s=>fmtDate(s.date)); title='Date'; exportName='Sales_Report_Date'; }

    const headers = [title,'Qty Sold (kg)','Total Cost Value','Sale Value (excl. GST)','GST Amount','Total Sale Value (incl. GST)','Net Profit / Loss'];
    const tableRows = rows.map(r=>[r.label, fmtNum(r.qty,1), money(r.costValue), money(r.saleValueExGst), money(r.gstValue), money(r.totalValue), money(r.pl)]);
    body.innerHTML = `
      <div class="table-wrap">
        <div class="card-pad-head">
          <strong style="font-size:13px;">${title}-wise Sales Summary</strong>
          <div style="display:flex;gap:8px;" class="no-print">
            <button class="btn btn-outline btn-sm" id="sr-xls">${icon('download')} Export Excel</button>
            <button class="btn btn-outline btn-sm" id="sr-pdf">${icon('download')} Export PDF</button>
          </div>
        </div>
        <table>
          <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.length===0? `<tr><td colspan="7" class="empty-state">No sales match the current filters.</td></tr>` :
            rows.map(r=>`<tr>
              <td><strong>${r.label}</strong></td>
              <td>${fmtNum(r.qty,1)}</td>
              <td>${money(r.costValue)}</td>
              <td>${money(r.saleValueExGst)}</td>
              <td>${money(r.gstValue)}</td>
              <td>${money(r.totalValue)}</td>
              <td style="color:${r.pl>=0?'hsl(var(--success))':'hsl(var(--destructive))'};font-weight:700;">${money(r.pl)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
    document.getElementById('sr-xls').addEventListener('click', ()=> exportCsv(exportName, headers, tableRows));
    document.getElementById('sr-pdf').addEventListener('click', ()=> window.print());
  }
  draw();
}

/* ================= REPORTS ================= */
function renderReports(){
  let tab = 'rm';
  const pkgFilters = {matId:'', ref:'', from:'', to:''};
  const content = document.getElementById('content');
  function draw(){
    content.innerHTML = `
      <div class="section-head">
        <div><h1>Reports &amp; Exports</h1><p>Raw Material, Finished Product, Production and Packaging reports, each exportable to Excel and PDF.</p></div>
      </div>
      <div class="tabs no-print">
        <button class="tab-btn ${tab==='rm'?'active':''}" data-tab="rm">Raw Material Report</button>
        <button class="tab-btn ${tab==='fg'?'active':''}" data-tab="fg">Finished Product Report</button>
        <button class="tab-btn ${tab==='prod'?'active':''}" data-tab="prod">Production Chart / Report</button>
        <button class="tab-btn ${tab==='pkg'?'active':''}" data-tab="pkg">Packaging Report</button>
      </div>
      <div id="report-body"></div>
    `;
    content.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>{ tab=b.getAttribute('data-tab'); draw(); }));
    if(tab==='rm') drawRmReport(); else if(tab==='fg') drawFgReport(); else if(tab==='prod') drawProdReport(); else drawPkgReport();
  }
  function reportHead(title, cols, exportId){
    return `
      <div class="table-wrap">
        <div class="card-pad-head">
          <strong style="font-size:13px;">${title}</strong>
          <div style="display:flex;gap:8px;" class="no-print">
            <button class="btn btn-outline btn-sm" id="${exportId}-xls">${icon('download')} Export Excel</button>
            <button class="btn btn-outline btn-sm" id="${exportId}-pdf">${icon('download')} Export PDF</button>
          </div>
        </div>
        <table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="${exportId}-tbody"></tbody></table>
      </div>
    `;
  }
  function bindExport(exportId, filename, headers, rows){
    document.getElementById(exportId+'-xls').addEventListener('click', ()=> exportCsv(filename, headers, rows));
    document.getElementById(exportId+'-pdf').addEventListener('click', ()=> window.print());
  }
  function drawRmReport(){
    const d = db();
    const rows = [];
    d.rawMaterials.forEach(m=>{
      const batches = d.rmBatches.filter(b=>b.matId===m.id);
      const inward = d.rmLedger.filter(l=>l.matId===m.id && l.type==='IN').reduce((s,l)=>s+l.qty,0);
      const consumed = d.rmLedger.filter(l=>l.matId===m.id && l.type==='OUT').reduce((s,l)=>s+l.qty,0);
      const closing = rmStock(m.id);
      const rate = rmAvgRate(m.id);
      const supplierNames = [...new Set(batches.map(b=>supName(b.supplierId)))].join(', ') || '—';
      rows.push([todayStr(), m.name+' ('+m.grade+')', batches.map(b=>b.batchNo).join(' / ')||'—', supplierNames, fmtNum(inward,1), fmtNum(consumed,1), fmtNum(closing,1), money(rate), money(closing*rate)]);
    });
    const headers = ['Date','Material & Grade','Batch ID(s)','Supplier','Inward Qty','Production Consumption','Closing Qty','Rate','Closing Stock Value'];
    document.getElementById('report-body').innerHTML = reportHead('Raw Material Report', headers, 'rm-rep');
    document.getElementById('rm-rep-tbody').innerHTML = rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="9" class="empty-state">No data.</td></tr>`;
    bindExport('rm-rep','Raw_Material_Report', headers, rows);
  }
  function drawFgReport(){
    const d = db();
    const rows = d.finishedGoods.map(b=>{
      const pb = d.productionBatches.find(p=>p.fgId===b.id);
      return [fmtDate(b.date), prodName(b.productId), b.id, fmtNum(b.qty,1), money(pb?pb.totalCost:0), money(b.costPerKg), fmtNum(b.remainingQty,1), money(b.remainingQty*b.costPerKg)];
    });
    const headers = ['Date','Product / Grade','FG Batch','Produced Qty','Production Cost','Cost / kg','Closing Qty','Stock Value'];
    document.getElementById('report-body').innerHTML = reportHead('Finished Product Report', headers, 'fg-rep');
    document.getElementById('fg-rep-tbody').innerHTML = rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="8" class="empty-state">No finished product batches yet.</td></tr>`;
    bindExport('fg-rep','Finished_Product_Report', headers, rows);
  }
  function drawProdReport(){
    const d = db();
    const rows = d.productionBatches.map(p=>{
      const prod = d.products.find(x=>x.id===p.productId);
      return [fmtDate(p.date), prod?prod.grade+' — '+prod.name:p.productId, fmtInt(p.lots), fmtNum(prod?prod.lotQty:0,1), fmtNum(p.expectedOutput,2), fmtNum(p.expectedOutput,2), money(p.rmCost), fmtNum(p.actualOutput,2), fmtNum(p.wastage,2)+' ('+fmtNum(p.wastagePct,1)+'%)', money(p.costPerKg)];
    });
    const headers = ['Production Date','Product / Grade','No. of Lots','Qty / Lot','Formula-based Requirement','Raw Material Consumption','Raw Material Cost','Actual Output','Evaporation / Wastage','Finished Product Cost / kg'];
    document.getElementById('report-body').innerHTML = reportHead('Production Chart / Production Report', headers, 'prod-rep');
    document.getElementById('prod-rep-tbody').innerHTML = rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="10" class="empty-state">No production entries yet.</td></tr>`;
    bindExport('prod-rep','Production_Report', headers, rows);
  }
  function drawPkgReport(){
    const d = db();
    const consumptions = d.packagingLedger.filter(l=>l.type==='OUT');
    const rows = consumptions.filter(l=>{
      if(pkgFilters.matId && l.matId!==pkgFilters.matId) return false;
      if(pkgFilters.ref && l.ref!==pkgFilters.ref) return false;
      if(pkgFilters.from && l.date<pkgFilters.from) return false;
      if(pkgFilters.to && l.date>pkgFilters.to) return false;
      return true;
    }).sort((a,b)=>b.date.localeCompare(a.date));
    const refs = [...new Set(consumptions.map(l=>l.ref))];
    const headers = ['Date','Production Run','Level / Item','Size','Brand','Batch ID','Qty Consumed','Value'];
    const tableRows = rows.map(l=>{
      const m = d.packagingMaterials.find(x=>x.id===l.matId);
      return [fmtDate(l.date), l.ref, pkgName(l.matId), m?m.size:'—', m?m.brand:'—', l.batchNo, fmtNum(l.qty,1), money(l.value)];
    });
    document.getElementById('report-body').innerHTML = `
      <div class="filter-bar no-print">
        <div class="filter-field" style="min-width:220px;"><label>Level / Item</label><select class="input" id="pkr-item">${selectOptions(pkgFilters.matId, d.packagingMaterials.map(m=>({value:m.id,label:pkgFullLabel(m.id)})))}</select></div>
        <div class="filter-field"><label>Production Run</label><select class="input" id="pkr-ref">${selectOptions(pkgFilters.ref, refs.map(r=>({value:r,label:r})))}</select></div>
        <div class="filter-field"><label>From Date</label><input class="input" type="date" id="pkr-from" value="${pkgFilters.from}" /></div>
        <div class="filter-field"><label>To Date</label><input class="input" type="date" id="pkr-to" value="${pkgFilters.to}" /></div>
        <div class="filter-actions"><span class="filter-count">${rows.length} of ${consumptions.length} consumption entries</span><button class="btn btn-outline btn-sm" id="pkr-clear">Clear Filters</button></div>
      </div>
      ${reportHead('Packaging Report — consumption by level', headers, 'pkg-rep')}
    `;
    document.getElementById('pkg-rep-tbody').innerHTML = tableRows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="8" class="empty-state">No packaging consumption matches the current filters.</td></tr>`;
    bindExport('pkg-rep','Packaging_Report', headers, tableRows);
    document.getElementById('pkr-item').addEventListener('change', e=>{ pkgFilters.matId=e.target.value; drawPkgReport(); });
    document.getElementById('pkr-ref').addEventListener('change', e=>{ pkgFilters.ref=e.target.value; drawPkgReport(); });
    document.getElementById('pkr-from').addEventListener('change', e=>{ pkgFilters.from=e.target.value; drawPkgReport(); });
    document.getElementById('pkr-to').addEventListener('change', e=>{ pkgFilters.to=e.target.value; drawPkgReport(); });
    document.getElementById('pkr-clear').addEventListener('click', ()=>{ pkgFilters.matId=''; pkgFilters.ref=''; pkgFilters.from=''; pkgFilters.to=''; drawPkgReport(); });
  }
  draw();
}
function exportCsv(filename, headers, rows){
  const strip = s => String(s).replace(/<[^>]*>/g,'').replace(/"/g,'""');
  const csv = [headers.map(strip).join(',')].concat(rows.map(r=>r.map(c=>`"${strip(c)}"`).join(','))).join('\r\n');
  const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('Excel (CSV) export downloaded');
}
